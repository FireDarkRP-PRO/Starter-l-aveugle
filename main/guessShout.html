<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        padding-bottom: 300px;
        font-family: Arial;
        text-align: center;
        background-image: url("https://i.imgur.com/KaSPZj2.jpeg");
        background-size: cover;        /* remplit tout l'écran */
        background-position: center;   /* centre l'image */
        background-repeat: no-repeat;  /* évite répétition */
        background-attachment: fixed; /* effet classe au scroll */
      }

      h1 {
        margin-bottom: 20px;
      }

      button {
        padding: 12px 25px;
        font-size: 16px;
        margin-bottom: 30px;
        cursor: pointer;
      }

      #loader {
        display: none;
        margin: 20px auto;
        border: 6px solid #ddd;
        border-top: 6px solid #333;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      audio {
        display: block;
        margin: auto;
      }

      #resultat {
        display: flex;
        justify-content: center; /* centre horizontalement */
        align-items: center;
        gap: 40px; /* espace entre les blocs */
        width: 90%;
        margin: 0 auto;
      }

      #BackBtn{
        top: 15px;
        left: 15px;
        padding: 10px 15px;
        font-size: 14px;
      }
      
      #BackBtn {
        position: fixed;
        background-color: #3c9c2c;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
        font-weight: bold;
        letter-spacing: 1px;
      }

      #BackBtn:hover {
        background-color: #2e7d22;
      }

      .top-zone {
        color: white;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      }
      
    </style>
  </head>
  <body>
    <a class="button" id="BackBtn" href="./index.html">↩️ Retour</a>  

    <div class="top-zone">
      <h1>🎧 Trouve le Pokémon avec son cri</h1>

      <h3>Générations</h3>
      <div id="genContainer" style="margin-bottom:15px;"></div>

      <br>
      <button onclick="tirer()">🎲 Tirer un cri</button>

      <div id="resultat" style="margin:20px;"></div>

      <div id="loader"></div>

      <br><br>

      <h2>Guess</h2>
      <div id="vies" style="font-size:20px; color:white;"></div>
      <br>
      <input list="pokemonList" id="searchInput" placeholder="Nom du Pokémon">
      <datalist id="pokemonList"></datalist>
      
      <button onclick="guessPokemon()">Guess</button>

      <div id="guessResult" style="margin-top:20px; font-size:22px; color:white;"></div>
      <div id="historique" style="margin-top:20px; color:white;"></div>
      <br><br>
      <button onclick="toggleIndices()">Indices : ON</button>
      <div id="indices" style="margin-top:15px; color:white;"></div>
    </div>

    <script>
      let currentPokemonData = null; // stock des infos pour indices
      let currentPokemon = null;
      let vies = 9;
      let locked = false;
      let erreurs = 0;
      let indicesActifs = true;
      let dejaGuesses = [];

      document.addEventListener("DOMContentLoaded", function() {
        afficherVies();
        chargerGenerations();
        chargerListePokemon();
        document.getElementById("searchInput")
          .addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
              guessPokemon();
            }
        });
      });
      
      async function tirer() {
        currentPokemonData = null;
        vies = 9;
        erreurs = 0;
        locked = false;
        dejaGuesses = [];

        document.getElementById("indices").innerHTML = "";
        afficherVies();
        document.getElementById("guessResult").innerHTML = "";
        document.getElementById("historique").innerHTML = "";
        document.getElementById("searchInput").value = "";

        const container = document.getElementById("resultat");
        const loader = document.getElementById("loader");

        // Reset affichage
        container.innerHTML = "";
        loader.style.display = "block";

        // Générations cochées
        const checked = Array.from(
          document.querySelectorAll("#genContainer input:checked")
        ).map(cb => cb.value);

        try {
          const res = await fetch("/api/random-pokemon-with-cry", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selectedGens: checked })
          });
          const data = await res.json();

          loader.style.display = "none";

          if (!data || !data.cry) {
            container.innerHTML = "Erreur lors du chargement du cri ❌";
            return;
          }

          currentPokemon = data;

          container.innerHTML = `
            <audio controls autoplay>
              <source src="${data.cry}" type="audio/ogg">
              Ton navigateur ne supporte pas l'audio.
            </audio>
          `;
        } catch (err) {
          loader.style.display = "none";
          console.error("Erreur lors du tirage :", err);
        }
      }

      async function guessPokemon() {
        if (!currentPokemon || locked) {
          document.getElementById("guessResult").innerHTML = "Tire un cri avant ❗";
          return;
        }

        const inputField = document.getElementById("searchInput");
        const input = inputField.value.trim().toLowerCase();
        inputField.value = "";

        if (dejaGuesses.includes(input)) {
          document.getElementById("guessResult").innerHTML = 
            "⚠️ Tu as déjà proposé ce Pokémon ! Ou tu as cliqué trop vite !";
          return;
        }

        const resultDiv = document.getElementById("guessResult");
        const loader = document.getElementById("loader");

        if (!input) return;

        resultDiv.innerHTML = "";
        loader.style.display = "block";

        try {
          const res = await fetch(`/api/search-pokemon?name=${encodeURIComponent(input)}`);
          const result = await res.json();

          loader.style.display = "none";

          if (!result) {
            resultDiv.innerHTML = "⚠️ Veuillez entrer un Pokémon valide";
            return;
          }

          dejaGuesses.push(result.name.toLowerCase());

          if (result.index === currentPokemon.index) {
            resultDiv.innerHTML = `
              🎉 Bonne réponse !<br>
              C'était ${result.name}
              <br><br>
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${result.index}.png"
              style="width:140px;">
            `;

            locked = true;
            return;
          }

          vies--;
          erreurs++;
          afficherVies();

          ajouterHistorique(result.name);

          const resData = await fetch(`/api/pokemon-caracteristiques?id=${currentPokemon.index}`);
          const data = await resData.json();
          currentPokemonData = data;
          afficherIndices(data);

          if (vies <= 0) {
            resultDiv.innerHTML = `
              💀 Perdu !<br>
              C'était ${currentPokemon.name}
              <br><br>
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${currentPokemon.index}.png"
              style="width:140px;">
            `;
            locked = true;
          } else {
            resultDiv.innerHTML = `❌ Faux ! Il reste ${vies} vie(s)`;
          }
        } catch (err) {
          loader.style.display = "none";
          console.error("Erreur lors de la recherche :", err);
        }
      }

      function afficherVies() {
        document.getElementById("vies").innerHTML =
          "Vies : " + "❤️".repeat(vies);
      }

      function ajouterHistorique(nom) {
        const div = document.getElementById("historique");
        div.innerHTML += `❌ ${nom}<br>`;
      }

      async function chargerListePokemon() {
        try {
          const res = await fetch("/api/pokemon-names");
          const noms = await res.json();

          const datalist = document.getElementById("pokemonList");
          datalist.innerHTML = "";

          noms.forEach(nom => {
            const option = document.createElement("option");
            option.value = nom;
            datalist.appendChild(option);
          });
        } catch (err) {
          console.error("Erreur chargement noms :", err);
        }
      }

      async function chargerGenerations() {
        try {
          const res = await fetch("/api/generations");
          const gens = await res.json();

          const container = document.getElementById("genContainer");
          container.innerHTML = "";

          gens.forEach(line => {
            const genName = line.split(":")[0];

            const label = document.createElement("label");
            label.style.marginRight = "10px";

            label.innerHTML = `
              <input type="checkbox" value="${genName}" checked>
              ${genName}
            `;

            container.appendChild(label);
          });
        } catch (err) {
          console.error("Erreur chargement générations :", err);
        }
      }

      function toggleIndices() {
        indicesActifs = !indicesActifs;

        const btn = document.querySelector("button[onclick='toggleIndices()']");
        btn.innerText = "Indices : " + (indicesActifs ? "ON" : "OFF");

        const div = document.getElementById("indices");

        if (!indicesActifs) {
          div.innerHTML = "";
          return;
        }

        if (currentPokemonData) {
          afficherIndices(currentPokemonData);
        }
      }

      function afficherIndices(data) {
        if (!indicesActifs) return;

        const div = document.getElementById("indices");
        let html = "";

        if (erreurs >= 2) {
          html += `🌍 Génération : ${data.generation}<br>`;
        }

        if(data.types.length === 2){
          if (erreurs >= 4 && data.types.length >= 1) {
            html += `🔥 Type 1 : ${data.types[0]}<br>`;
          }

          if (erreurs >= 5 && data.types.length === 2) {
            html += `🔥 Type 2 : ${data.types[1]}<br>`;
          }
        }
        else{
          if (erreurs >= 5) {
            html += `🔥 Type : ${data.types[0]}<br>`;
          }
        }

        if (erreurs >= 7) {
          html += `
            👤 Silhouette :<br>
            <div style="width:140px; display: block; margin: auto; background-color: white;">
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${currentPokemon.index}.png" style="width:140px; filter: brightness(0); user-drag: none; -webkit-user-drag: none; user-select: none;">
            </div>
          `;
        }

        div.innerHTML = html;
      }

    </script>
  </body>
</html>
