<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        padding-bottom: 300px;
        font-family: Arial;
        text-align: center;
        background-image: url("https://pokeflip.com/cdn/shop/articles/The_Phenomenal_Firepower_of_Charizard_-_The_Ultimate_Pokemon.jpg");
        background-size: cover;        /* remplit tout l'écran */
        background-position: center;   /* centre l'image */
        background-repeat: no-repeat;  /* évite répétition */
        background-attachment: fixed; /* effet classe au scroll */
      }

      h1 {
        margin-bottom: 20px;
      }

      button {
        padding: 12px 25px;
        font-size: 16px;
        margin-bottom: 30px;
        cursor: pointer;
      }

      #loader {
        display: none;
        margin: 20px auto;
        border: 6px solid #ddd;
        border-top: 6px solid #333;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #resultat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        margin: 0 auto;
      }

      .pokemon {
        flex: 1;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
      }

      .pokemon img {
        display: block;
        margin: 15px auto 0;
        width: 120px;
        image-rendering: pixelated; /* garde l’effet sprite */
      }

      .top-zone {
        color: white;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      }

      #BackBtn{
        top: 15px;
        left: 15px;
        padding: 10px 15px;
        font-size: 14px;
      }
      
      #BackBtn {
        position: fixed;
        background-color: #3c9c2c;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
        font-weight: bold;
        letter-spacing: 1px;
      }

      #BackBtn:hover {
        background-color: #2e7d22;
      }
      
    </style>
  </head>
  <body>
    <a class="button" id="BackBtn" href="/">↩️ Retour</a>

    <div class="top-zone">
      <h1>Guess the type</h1>

      <h3>Générations</h3>
      <div id="genContainer" style="margin-bottom:15px;"></div>

      <br>
      <button onclick="tirer()">Tirer les Pokémons</button>

      <div id="resultat"></div>

      <div id="loader"></div>

      <div id="vies" style="font-size:20px; color:white; margin-top:10px;"></div>

      <br>

      <select id="type1"></select>
      <select id="type2"></select>
      <br><br>
      <button onclick="guessType()">Guess</button>
      <div id="resultatGuess" style="margin-top:20px; font-size:26px; color:white;"></div>
      <div id="badGuess1" style="color:white;"></div>
      <div id="badGuess2" style="color:white;"></div>
      <div id="badGuess3" style="color:white;"></div>
      <div id="badGuess4" style="color:white;"></div>
      <div id="badGuess5" style="color:white;"></div>
    </div>

    <script>
      let currentPokemon = null;
      let guessLocked = false;
      let vies = 5;

      document.addEventListener("DOMContentLoaded", function() {
        chargerGenerations();
        chargerListePokemon();
        chargerTypes();
      });
      
      async function tirer() {
        vies = 5;
        guessLocked = false;

        document.getElementById("badGuess1").innerHTML = "";
        document.getElementById("badGuess2").innerHTML = "";
        document.getElementById("badGuess3").innerHTML = "";
        document.getElementById("badGuess4").innerHTML = "";
        document.getElementById("badGuess5").innerHTML = "";
        document.getElementById("resultatGuess").innerHTML = "";
        afficherVies();

        const slotsContainer = document.getElementById("resultat");
        const loader = document.getElementById("loader");

        // Nombre choisi
        const nb = 1;

        // Générations cochées
        const checked = Array.from(
          document.querySelectorAll("#genContainer input:checked")
        ).map(cb => cb.value);

        // Reset affichage
        slotsContainer.innerHTML = "";
        loader.style.display = "block";

        try {
          const res = await fetch("/api/random-pokemon", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selectedGens: checked, nb: nb })
          });

          const pokemonsAndIndex = await res.json();
          loader.style.display = "none";

          let pokemons = pokemonsAndIndex[0]; 
          let indexs = pokemonsAndIndex[1];

          pokemons.forEach((nom, i) => {

            const index = indexs[i];

            const div = document.createElement("div");
            div.className = "pokemon";

            div.innerHTML = `
              <div>
                ${index.toString().padStart(4, '0')} ${nom}
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${index}.png">
              </div>
            `;

            slotsContainer.appendChild(div);

            currentPokemon = {
              name: nom,
              index: index
            };

            document.getElementById("resultatGuess").innerHTML = "";
          });
        } catch (err) {
          loader.style.display = "none";
          console.error("Erreur lors du tirage :", err);
        }
      }

      async function chargerListePokemon() {
        try {
          const res = await fetch("/api/pokemon-names");
          const noms = await res.json();

          const datalist = document.getElementById("pokemonList");
          if (datalist) {
            datalist.innerHTML = "";
            noms.forEach(nom => {
              const option = document.createElement("option");
              option.value = nom;
              datalist.appendChild(option);
            });
          }
        } catch (err) {
          console.error("Erreur chargement noms :", err);
        }
      }

      async function chargerGenerations() {
        try {
          const res = await fetch("/api/generations");
          const gens = await res.json();

          const container = document.getElementById("genContainer");
          container.innerHTML = "";

          gens.forEach(line => {
            const genName = line.split(":")[0];

            const label = document.createElement("label");
            label.style.marginRight = "10px";

            label.innerHTML = `
              <input type="checkbox" value="${genName}" checked>
              ${genName}
            `;

            container.appendChild(label);
          });
        } catch (err) {
          console.error("Erreur chargement générations :", err);
        }
      }

      const types = [
        "Normal","Feu","Eau","Électrik","Plante","Glace",
        "Combat","Poison","Sol","Vol","Psy","Insecte",
        "Roche","Spectre","Dragon","Ténèbres","Acier","Fée"
      ];

      function chargerTypes() {

        const t1 = document.getElementById("type1");
        const t2 = document.getElementById("type2");

        t1.innerHTML = '<option value="">Type 1</option>';
        t2.innerHTML = '<option value="">Type 2</option>';

        types.forEach(t => {
          t1.innerHTML += `<option value="${t}">${t}</option>`;
          t2.innerHTML += `<option value="${t}">${t}</option>`;
        });

        // ajout "Aucun"
        t2.innerHTML += `<option value="Aucun">Aucun</option>`;
      }

      async function guessType() {

        const resultDiv = document.getElementById("resultatGuess");

        if (!currentPokemon || guessLocked) {
          resultDiv.innerHTML = "Veuillez tirer un nouveau pokémon";
          return;
        }

        let t1 = document.getElementById("type1").value;
        let t2 = document.getElementById("type2").value;

        if (!t1) {
          alert("Choisis au moins un type !");
          return;
        }

        if (!t2) t2 = "Aucun";

        const loader = document.getElementById("loader");

        resultDiv.innerHTML = "";
        loader.style.display = "block";

        try {
          const res = await fetch(`/api/pokemon-caracteristiques?id=${currentPokemon.index}`);
          const data = await res.json();

          loader.style.display = "none";

          let vraisTypes = [...data.types];

          if (vraisTypes.length === 1) {
            vraisTypes.push("Aucun");
          }

          let message = "";
          let correct = false;

          if (
            (t1 === vraisTypes[0] && t2 === vraisTypes[1]) ||
            (t1 === vraisTypes[1] && t2 === vraisTypes[0])
          ) {
            correct = true;
          }

          if (correct) {
            resultDiv.innerHTML = "🎉✅ Correct ! → " + vraisTypes.join(" / ");
            guessLocked = true;
            return;
          }

          const bonTypes = [];
          const mauvaisTypes = [];

          if (vraisTypes.includes(t1)) {
            bonTypes.push(t1);
          } else {
            mauvaisTypes.push(t1);
          }

          if (vraisTypes.includes(t2)) {
            bonTypes.push(t2);
          } else {
            mauvaisTypes.push(t2);
          }

          if (bonTypes.length === 1) {
            if (bonTypes[0] === "Aucun") {
              message = `✅ Le Pokémon n'a qu’un seul type`;
            } 
            else {
              message = `✅ ${bonTypes[0]} est correct`;
            }
            
            if (mauvaisTypes[0] === "Aucun") {
              message += ` | ❌ Le Pokémon a un deuxième type`;
            } 
            else {
              message += ` | ❌ ${mauvaisTypes[0]} est faux`;
            }
          } 
          else {
            const fauxMessages = mauvaisTypes.map(t => {
              if (t === "Aucun") {
                return "Le Pokémon a un deuxième type";
              } else {
                return `${t} est faux`;
              }
            });
            message = "❌ " + fauxMessages.join(" | ❌ ");
          }

          vies--;
          afficherVies();
          if (vies <= 0) {
            resultDiv.innerHTML = "💀 Perdu ! → " + vraisTypes.join(" / ");
            guessLocked = true;
          } else {
            resultDiv.innerHTML = "❌ Faux ! Il reste " + vies + " vie(s)";
          }

          if (document.getElementById("badGuess1").innerHTML === "") {
            document.getElementById("badGuess1").innerHTML = message;
          } else if (document.getElementById("badGuess2").innerHTML === "") {
            document.getElementById("badGuess2").innerHTML = message;
          } else if (document.getElementById("badGuess3").innerHTML === "") {
            document.getElementById("badGuess3").innerHTML = message;
          } else if (document.getElementById("badGuess4").innerHTML === "") {
            document.getElementById("badGuess4").innerHTML = message;
          } else if (document.getElementById("badGuess5").innerHTML === "") {
            document.getElementById("badGuess5").innerHTML = message;
          }
        } catch (err) {
          loader.style.display = "none";
          console.error("Erreur lors de la vérification :", err);
        }
      }

      function afficherVies() {
        document.getElementById("vies").innerHTML =
          "Vies : " + "❤️".repeat(vies);
      }

    </script>
  </body>
</html>
