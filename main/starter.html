<!DOCTYPE html>

    <style>

  <body>
    <a class="button" id="rulesBtn" href="./starterRules.html">📜 Règles</a>
    <a class="button" id="ShowdownBtn" href="https://pokemonshowdown.com/" >⚔️ Pokémon Showdown</a>
    <a class="button" id="BackBtn" href="./index.html" onclick="return couperEtRetourner(event)">↩️ Retour</a>  
        
    <div class="top-zone">
      <h1>Starter Pokémon à l'aveugle</h1>

      <div id="badgeMultijoueur"></div>
      <div id="statutTourZone"></div>

      <div class="zone-jeu-layout">
        <div id="zoneJeuCentrale">
          <div id="filtresGenerations" class="filtres-gen"></div>
          <div class="filtres-actions">
            <button type="button" onclick="basculerToutesGenerations(true)">Tout cocher</button>
            <button type="button" onclick="basculerToutesGenerations(false)">Tout décocher</button>
          </div>

          <button id="tirageBtn" onclick="tirerPokemons()">🎲 Tirer 3 Pokémon</button>

          <div id="pokemonContainer"></div>

          <div id="zoneActionsMultijoueur"></div>

          <div id="equipeGaucheZone" class="ligne-equipe"></div>
          <div id="equipeDroiteZone" class="ligne-equipe"></div>
        </div>
      </div>

      <div id="equipesFinaleZone" style="display:none;"></div>

      <hr style="max-width:400px; margin:30px auto;">

      <div class="zone-recherche">
        <div class="recherche-wrapper">
          <input type="text" id="rechercheInput" placeholder="Nom ou numéro de Pokédex..." autocomplete="off">
          <div id="suggestionsListe" class="suggestions-liste"></div>
        </div>
        <button id="rechercheBtn" onclick="rechercherPokemon()">🔍 Rechercher</button>
      </div>
      <div id="rechercheErreurZone"></div>
      <div id="ficheCorps" class="fiche-inline"></div>
    </div>

    <script>
      // Liste complète des pokémon, chargée une seule fois depuis le fichier BDD
      let allPokemons = [];

      async function chargerPokemons() {
        if (allPokemons.length > 0) return allPokemons;

        const reponse = await fetch('../BDD/pokemon.txt');
        const texte = await reponse.text();

        allPokemons = texte
          .split('\n')
          .map(ligne => ligne.trim())
          .filter(ligne => ligne.length > 0)
          .map(ligne => {
            const espace = ligne.indexOf(' ');
            const numero = ligne.substring(0, espace);
            const nom = ligne.substring(espace + 1).trim();
            return { id: parseInt(numero, 10), nom: nom };
          });

        return allPokemons;
      }

      // ---------- Formes régionales ----------
      // Chargées depuis ../BDD/formesRegionales.txt, format par ligne :
      //   idNationalDuPokemonDeBase;slugPokeAPIDeLaForme;nomAfficheDeLaForme
      // Les formes ne sont PAS ajoutées à allPokemons : ça leur donnerait plus
      // de chances d'être tirées que les autres pokémon. Un pokémon tiré qui a
      // des formes régionales peut ensuite garder sa forme normale ou en recevoir
      // une au hasard, chaque possibilité (normale incluse) ayant la même chance.
      let formesRegionalesParEspece = null;

      async function chargerFormesRegionales() {
        if (formesRegionalesParEspece) return formesRegionalesParEspece;
        formesRegionalesParEspece = {};

        try {
          const reponse = await fetch('../BDD/formesRegionales.txt');
          const texte = await reponse.text();

          texte
            .split('\n')
            .map(ligne => ligne.trim())
            .filter(ligne => ligne.length > 0 && !ligne.startsWith('#'))
            .forEach(ligne => {
              const [idBaseTexte, slug, nomAffiche] = ligne.split(';').map(v => v.trim());
              const idBase = parseInt(idBaseTexte, 10);
              if (!formesRegionalesParEspece[idBase]) formesRegionalesParEspece[idBase] = [];
              formesRegionalesParEspece[idBase].push({ slug, nomAffiche });
            });
        } catch (erreur) {
          console.error('Impossible de charger ../BDD/formesRegionales.txt', erreur);
        }

        return formesRegionalesParEspece;
      }

      // Pour chaque pokémon tiré : s'il a au moins une forme régionale connue,
      // on tire au hasard soit sa forme normale, soit une de ses formes régionales
      // (chaque forme, normale incluse, a la même probabilité d'être choisie).
      async function appliquerFormesRegionales(pokemons) {
        const formes = await chargerFormesRegionales();

        return Promise.all(pokemons.map(async p => {
          const formesDispo = formes[p.id];
          if (!formesDispo || formesDispo.length === 0) return p;

          const options = [null, ...formesDispo]; // null = forme normale
          const forme = options[Math.floor(Math.random() * options.length)];

          if (!forme) return p;

          try {
            const dataForme = await fetch(`https://pokeapi.co/api/v2/pokemon/${forme.slug}`).then(r => r.json());
            return {
              id: dataForme.id,
              nom: forme.nomAffiche,
              idAffiche: String(p.id).padStart(3, '0'),
              spriteUrl: dataForme.sprites && dataForme.sprites.front_default
            };
          } catch (erreur) {
            console.error(`Impossible de charger la forme régionale "${forme.slug}"`, erreur);
            return p;
          }
        }));
      }

      // Renvoie le numéro à afficher et le sprite à utiliser pour un pokémon,
      // qu'il s'agisse d'un pokémon normal ou d'une forme régionale.
      function infosAffichagePokemon(p) {
        return {
          idFormate: p.idAffiche || String(p.id).padStart(3, '0'),
          spriteUrl: p.spriteUrl || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`
        };
      }

      // ---------- Filtre par génération ----------

      let listeGenerations = [];

      async function chargerGenerations() {
        if (listeGenerations.length > 0) return listeGenerations;

        const reponse = await fetch('../BDD/genPokemon.txt');
        const texte = await reponse.text();

        listeGenerations = texte
          .split('\n')
          .map(ligne => ligne.trim())
          .filter(ligne => ligne.length > 0)
          .map(ligne => {
            const [nomGen, plage] = ligne.split(':');
            const [min, max] = plage.split('-').map(n => parseInt(n, 10));
            const numero = parseInt(nomGen.replace(/\D/g, ''), 10);
            return { numero, nom: nomGen, min, max };
          });

        return listeGenerations;
      }

      function afficherFiltresGenerations(generations) {
        const conteneur = document.getElementById('filtresGenerations');
        conteneur.innerHTML = generations.map(g => `
          <label class="gen-case">
            <input type="checkbox" class="gen-checkbox" value="${g.numero}" checked>
            ${g.nom}
          </label>
        `).join('');

        document.querySelectorAll('.gen-checkbox').forEach(cb => {
          cb.addEventListener('change', envoyerSelectionGenerations);
        });
      }

      function basculerToutesGenerations(cocher) {
        document.querySelectorAll('.gen-checkbox').forEach(cb => { cb.checked = cocher; });
        envoyerSelectionGenerations();
      }

      function envoyerSelectionGenerations() {
        if (connexionMultijoueur && connexionMultijoueur.open) {
          const numerosSelectionnes = [...document.querySelectorAll('.gen-checkbox:checked')]
            .map(cb => parseInt(cb.value, 10));
          connexionMultijoueur.send({ type: 'selectionGen', generations: numerosSelectionnes });
        }
      }

      function appliquerSelectionGenerations(numerosSelectionnes) {
        document.querySelectorAll('.gen-checkbox').forEach(cb => {
          cb.checked = numerosSelectionnes.includes(parseInt(cb.value, 10));
        });
      }

      async function obtenirPokemonsFiltresParGeneration() {
        const liste = await chargerPokemons();
        const generations = await chargerGenerations();

        const numerosSelectionnes = [...document.querySelectorAll('.gen-checkbox:checked')]
          .map(cb => parseInt(cb.value, 10));

        if (numerosSelectionnes.length === 0) {
          return [];
        }

        const plagesSelectionnees = generations.filter(g => numerosSelectionnes.includes(g.numero));

        return liste.filter(p =>
          plagesSelectionnees.some(g => p.id >= g.min && p.id <= g.max)
        );
      }

      function choisirPokemonsAleatoires(liste, quantite) {
        const indicesChoisis = new Set();
        while (indicesChoisis.size < quantite && indicesChoisis.size < liste.length) {
          indicesChoisis.add(Math.floor(Math.random() * liste.length));
        }
        return [...indicesChoisis].map(i => liste[i]);
      }

      function afficherPokemons(pokemons) {
        const container = document.getElementById('pokemonContainer');
        container.innerHTML = '';

        pokemons.forEach(p => {
          const carte = document.createElement('div');
          carte.className = 'pokemon-card';
          carte.title = 'Cliquer pour voir sa fiche';
          carte.onclick = () => {
            document.getElementById('rechercheInput').value = p.nom;
            document.getElementById('rechercheInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            lancerAffichageFiche(p.id, p.nom);
          };

          const { idFormate, spriteUrl } = infosAffichagePokemon(p);

          carte.innerHTML = `
            <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
            <p>${p.nom}</p>
            <span class="num">#${idFormate}</span>
          `;

          container.appendChild(carte);
        });
      }

      async function tirerPokemons() {
        if (modeMultijoueur) {
          return tirerPokemonsMultijoueur();
        }

        const container = document.getElementById('pokemonContainer');
        try {
          const listeFiltree = await obtenirPokemonsFiltresParGeneration();

          if (listeFiltree.length === 0) {
            container.innerHTML = '<p id="erreurMsg">Sélectionne au moins une génération avant de tirer.</p>';
            return;
          }

          const pokemonsTires = await appliquerFormesRegionales(choisirPokemonsAleatoires(listeFiltree, 3));
          afficherPokemons(pokemonsTires);
        } catch (erreur) {
          container.innerHTML = '<p id="erreurMsg">Impossible de charger la liste des pokémon (../BDD/pokemon.txt ou ../BDD/genPokemon.txt).</p>';
          console.error(erreur);
        }
      }

      // ================= Mode multijoueur : tour par tour =================

      let modeMultijoueur = false;
      let monRoleJeu = null;            // 'hote' | 'joueur'
      let tourDe = 'hote';              // à qui de tirer actuellement
      let tirageActuel = [];            // les 3 pokémon du round en cours
      let tirageEffectue = false;       // un tirage a-t-il été fait ce round ?
      let indicesEnvoyes = false;
      let indicesActuels = ['', '', ''];
      let choixEffectue = false;        // le joueur qui devine a-t-il choisi ?
      let indexChoisi = null;
      let revelesTableau = [false, false, false];
      let equipes = { hote: [], joueur: [] };

      function estMonTour() {
        return monRoleJeu === tourDe;
      }

      function basculerTour() {
        tourDe = (tourDe === 'hote') ? 'joueur' : 'hote';
      }

      function reinitialiserRoundMultijoueur() {
        tirageActuel = [];
        tirageEffectue = false;
        indicesEnvoyes = false;
        indicesActuels = ['', '', ''];
        choixEffectue = false;
        indexChoisi = null;
        revelesTableau = [false, false, false];
      }

      function initialiserModeMultijoueurJeu() {
        modeMultijoueur = true;
        monRoleJeu = sessionStorage.getItem('mp_role') === 'hote' ? 'hote' : 'joueur';
        tourDe = 'hote';
        reinitialiserRoundMultijoueur();
        afficherMiniEquipes();
        rafraichirVueMultijoueur();
      }

      async function tirerPokemonsMultijoueur() {
        if (!estMonTour() || tirageEffectue) return;

        const listeFiltree = await obtenirPokemonsFiltresParGeneration();
        if (listeFiltree.length === 0) {
          document.getElementById('pokemonContainer').innerHTML =
            '<p id="erreurMsg">Sélectionne au moins une génération avant de tirer.</p>';
          return;
        }

        tirageActuel = await appliquerFormesRegionales(choisirPokemonsAleatoires(listeFiltree, 3));
        tirageEffectue = true;

        if (connexionMultijoueur && connexionMultijoueur.open) {
          connexionMultijoueur.send({ type: 'tirage', pokemons: tirageActuel });
        }

        rafraichirVueMultijoueur();
      }

      function envoyerIndices() {
        indicesActuels = [0, 1, 2].map(i => {
          const champ = document.getElementById('indiceTexte-' + i);
          return champ ? champ.value.trim() : '';
        });
        indicesEnvoyes = true;

        if (connexionMultijoueur && connexionMultijoueur.open) {
          connexionMultijoueur.send({ type: 'indices', textes: indicesActuels });
        }

        rafraichirVueActive();
      }

      function reveler(i) {
        if (revelesTableau[i]) return;
        revelesTableau[i] = true;

        if (connexionMultijoueur && connexionMultijoueur.open) {
          connexionMultijoueur.send({ type: 'reveal', index: i });
        }

        rafraichirVueActive();
      }

      function terminerTour() {
        if (connexionMultijoueur && connexionMultijoueur.open) {
          connexionMultijoueur.send({ type: 'finTour' });
        }
        finDuTour();
      }

      // Appelée localement (bouton "Terminer mon tour") ET à la réception du message 'finTour'.
      // C'est le seul moment où l'affichage des équipes et la vérification de fin de partie ont lieu,
      // pour éviter qu'un joueur voie un pokémon avant que l'autre ne l'ait révélé.
      function finDuTour() {
        basculerTour();
        reinitialiserRoundMultijoueur();
        afficherMiniEquipes();

        if (equipes.hote.length >= 6 && equipes.joueur.length >= 6) {
          afficherEquipesFinales();
        } else {
          rafraichirVueMultijoueur();
        }
      }

      function tenterChoix(i) {
        if (choixEffectue) return;

        const confirmation = confirm('Confirmes-tu ton choix ? Cette action est définitive.');
        if (!confirmation) return;

        indexChoisi = i;
        choixEffectue = true;
        equipes[monRoleJeu].push(tirageActuel[i]);

        if (connexionMultijoueur && connexionMultijoueur.open) {
          connexionMultijoueur.send({ type: 'choix', index: i, role: monRoleJeu });
        }

        rafraichirVueMultijoueur();
      }

      function rafraichirVueMultijoueur() {
        if (!modeMultijoueur) return;

        if (estMonTour()) {
          rafraichirVueActive();
        } else {
          rafraichirVueAttente();
        }
      }

      function genererMiniListe(liste) {
        if (liste.length === 0) {
          return '<p class="mini-liste-vide">Aucun pokémon pour l\'instant</p>';
        }

        return liste.map(p => {
          const { spriteUrl } = infosAffichagePokemon(p);
          return `
            <div class="mini-pokemon">
              <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
              <div>${p.nom}</div>
            </div>
          `;
        }).join('');
      }

      function afficherMiniEquipes() {
        const autreRoleJeu = monRoleJeu === 'hote' ? 'joueur' : 'hote';

        const gauche = document.getElementById('equipeGaucheZone');
        const droite = document.getElementById('equipeDroiteZone');

        gauche.classList.add('actif');
        droite.classList.add('actif');

        gauche.innerHTML = `<div class="colonne-titre">Ton équipe</div><div class="mini-liste">${genererMiniListe(equipes[monRoleJeu])}</div>`;
        droite.innerHTML = `<div class="colonne-titre">Adversaire</div><div class="mini-liste">${genererMiniListe(equipes[autreRoleJeu])}</div>`;
      }

      function rafraichirVueActive() {
        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-connecte">🎯 C\'est ton tour !</span>';

        const boutonTirage = document.getElementById('tirageBtn');
        const zoneActions = document.getElementById('zoneActionsMultijoueur');

        if (!tirageEffectue) {
          boutonTirage.style.display = 'inline-block';
          boutonTirage.disabled = false;
          document.getElementById('pokemonContainer').innerHTML = '';
          zoneActions.innerHTML = '';
          return;
        }

        boutonTirage.style.display = 'none';

        afficherPokemons(tirageActuel);

        const cartes = document.querySelectorAll('#pokemonContainer .pokemon-card');
        cartes.forEach((carte, i) => {
          const zone = document.createElement('div');
          zone.className = 'zone-indice';
          zone.onclick = (e) => e.stopPropagation();

          if (!indicesEnvoyes) {
            zone.innerHTML = `<textarea class="indice-texte" id="indiceTexte-${i}" placeholder="Indice pour ce pokémon..."></textarea>`;
          } else if (!choixEffectue) {
            zone.innerHTML = `<p class="indice-envoye">💬 ${indicesActuels[i] || '(vide)'}</p>`;
          } else {
            const marque = (i === indexChoisi) ? ' ⭐' : '';
            zone.innerHTML = revelesTableau[i]
              ? `<p class="indice-envoye">✅ Révélé${marque}</p>`
              : `<button class="btn-reveler" onclick="reveler(${i})">👁️ Révéler${marque}</button>`;
          }

          carte.appendChild(zone);
        });

        if (!indicesEnvoyes) {
          zoneActions.innerHTML = '<button onclick="envoyerIndices()">📨 Envoyer les indices</button>';
        } else if (!choixEffectue) {
          zoneActions.innerHTML = '<span class="badge-multijoueur badge-attente">⏳ En attente du choix de l\'autre joueur...</span>';
        } else {
          zoneActions.innerHTML = '<button onclick="terminerTour()">✅ Terminer mon tour</button>';
        }
      }

      function genererBoitesNoires(message) {
        return [0, 1, 2].map(() => `
          <div class="boite-noire boite-inactive">
            <div class="point-interrogation">❔</div>
            <p class="indice-boite">${message}</p>
          </div>
        `).join('');
      }

      function rafraichirVueAttente() {
        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-attente">⏳ C\'est le tour de l\'autre joueur...</span>';

        document.getElementById('tirageBtn').style.display = 'none';
        document.getElementById('zoneActionsMultijoueur').innerHTML = '';

        const container = document.getElementById('pokemonContainer');

        if (!tirageEffectue) {
          container.innerHTML = genererBoitesNoires('En attente du tirage...');
          return;
        }

        if (!indicesEnvoyes) {
          container.innerHTML = genererBoitesNoires('En attente des indices...');
          return;
        }

        container.innerHTML = tirageActuel.map((p, i) => {
          if (revelesTableau[i]) {
            const { idFormate, spriteUrl } = infosAffichagePokemon(p);
            const marque = (i === indexChoisi) ? '<p class="marque-choix">🎉 Ton choix !</p>' : '';
            return `
              <div class="pokemon-card">
                <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
                <p>${p.nom}</p>
                <span class="num">#${idFormate}</span>
                ${marque}
              </div>
            `;
          }

          const classeChoisie = (choixEffectue && i === indexChoisi) ? ' boite-choisie' : '';
          const classeInactive = choixEffectue ? ' boite-inactive' : '';
          const texteStatut = choixEffectue
            ? (i === indexChoisi ? '🔒 Choix enregistré' : '')
            : `💬 ${indicesActuels[i] || "(pas d'indice)"}`;
          const clic = choixEffectue ? '' : `onclick="tenterChoix(${i})"`;

          return `
            <div class="boite-noire${classeChoisie}${classeInactive}" ${clic}>
              <div class="point-interrogation">❔</div>
              <p class="indice-boite">${texteStatut}</p>
            </div>
          `;
        }).join('');
      }

      function afficherEquipesFinales() {
        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-connecte">🏆 Équipes complètes !</span>';
        document.getElementById('tirageBtn').style.display = 'none';
        document.getElementById('zoneActionsMultijoueur').innerHTML = '';
        document.getElementById('pokemonContainer').innerHTML = '';
        document.getElementById('filtresGenerations').innerHTML = '';
        document.getElementById('equipeGaucheZone').classList.remove('actif');
        document.getElementById('equipeDroiteZone').classList.remove('actif');

        const zone = document.getElementById('equipesFinaleZone');
        zone.style.display = 'block';

        const genererListe = (liste) => liste.map(p => {
          const { idFormate, spriteUrl } = infosAffichagePokemon(p);
          return `
            <div class="pokemon-card">
              <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
              <p>${p.nom}</p>
              <span class="num">#${idFormate}</span>
            </div>
          `;
        }).join('');

        const monEquipe = equipes[monRoleJeu];
        const equipeAdverse = equipes[monRoleJeu === 'hote' ? 'joueur' : 'hote'];

        zone.innerHTML = `
          <h2 class="titre-equipe">🎉 Ton équipe</h2>
          <div class="pokemon-team-grid">${genererListe(monEquipe)}</div>
          <button id="btnTelechargerEquipe" onclick="genererFormatShowdown()">📋 Générer le format Pokémon Showdown</button>
          <p class="note-showdown">⚠️ Pokémon Showdown n'accepte que les noms anglais — la conversion se fait automatiquement.</p>
          <div id="resultatShowdown"></div>
          <h2 class="titre-equipe">Équipe adverse</h2>
          <div class="pokemon-team-grid">${genererListe(equipeAdverse)}</div>
        `;
      }

      async function genererFormatShowdown() {
        const bouton = document.getElementById('btnTelechargerEquipe');
        const zoneResultat = document.getElementById('resultatShowdown');
        const equipe = equipes[monRoleJeu];
        if (!equipe || equipe.length === 0) return;

        const texteOriginal = bouton.textContent;
        bouton.disabled = true;
        bouton.textContent = '⏳ Génération...';

        try {
          const nomsAnglais = await Promise.all(equipe.map(async (p) => {
            try {
              const dataPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${p.id}`).then(r => r.json());
              const espece = await fetch(dataPokemon.species.url).then(r => r.json());
              const nomEn = espece.names.find(n => n.language.name === 'en');
              return nomEn ? nomEn.name : p.nom;
            } catch {
              return p.nom;
            }
          }));

          const contenu = nomsAnglais.join('\n\n');

          zoneResultat.innerHTML = `
            <textarea id="texteShowdown" class="texte-showdown" readonly>${contenu}</textarea>
            <button id="btnCopierShowdown" onclick="copierFormatShowdown()">📄 Copier</button>
          `;
        } catch (erreur) {
          console.error(erreur);
          alert("Erreur lors de la génération du format. Réessaie.");
        } finally {
          bouton.disabled = false;
          bouton.textContent = texteOriginal;
        }
      }

      function copierFormatShowdown() {
        const champ = document.getElementById('texteShowdown');
        if (!champ) return;

        navigator.clipboard.writeText(champ.value).then(() => {
          const bouton = document.getElementById('btnCopierShowdown');
          const texteOriginal = bouton.textContent;
          bouton.textContent = '✅ Copié !';
          setTimeout(() => { bouton.textContent = texteOriginal; }, 1500);
        });
      }

      // ---------- Connexion multijoueur (reprise depuis le salon) ----------

      const PREFIXE_SALON = 'starter-aveugle-';
      let peerMultijoueur = null;
      let connexionMultijoueur = null;

      function afficherBadgeMultijoueur(texte, classe) {
        const badge = document.getElementById('badgeMultijoueur');
        badge.innerHTML = `<span class="badge-multijoueur ${classe}">${texte}</span>`;
      }

      function configurerConnexionMultijoueur() {
        connexionMultijoueur.on('open', () => {
          afficherBadgeMultijoueur('🟢 Connecté avec l\'autre joueur', 'badge-connecte');
        });

        connexionMultijoueur.on('data', (donnee) => {
          if (!donnee || !donnee.type) return;

          switch (donnee.type) {
            case 'tirage':
              if (modeMultijoueur) {
                tirageActuel = donnee.pokemons;
                tirageEffectue = true;
                rafraichirVueMultijoueur();
              } else {
                afficherPokemons(donnee.pokemons);
              }
              break;

            case 'selectionGen':
              appliquerSelectionGenerations(donnee.generations);
              break;

            case 'indices':
              indicesActuels = donnee.textes;
              indicesEnvoyes = true;
              rafraichirVueMultijoueur();
              break;

            case 'choix':
              indexChoisi = donnee.index;
              choixEffectue = true;
              equipes[donnee.role].push(tirageActuel[donnee.index]);
              rafraichirVueMultijoueur();
              break;

            case 'reveal':
              revelesTableau[donnee.index] = true;
              rafraichirVueMultijoueur();
              break;

            case 'finTour':
              finDuTour();
              break;
          }
        });

        connexionMultijoueur.on('close', () => {
          afficherBadgeMultijoueur('🔴 Le partenaire s\'est déconnecté', 'badge-erreur');
        });
      }

      function creerPeerHote(code, tentative) {
        peerMultijoueur = new Peer(PREFIXE_SALON + code);

        peerMultijoueur.on('open', () => {
          peerMultijoueur.on('connection', (conn) => {
            connexionMultijoueur = conn;
            configurerConnexionMultijoueur();
          });
        });

        peerMultijoueur.on('error', (erreur) => {
          if (erreur.type === 'unavailable-id' && tentative < 6) {
            setTimeout(() => creerPeerHote(code, tentative + 1), 500);
          } else {
            console.error(erreur);
            afficherBadgeMultijoueur('⚠️ Connexion multijoueur impossible', 'badge-erreur');
          }
        });
      }

      function creerPeerJoueur(code, tentative) {
        peerMultijoueur = new Peer();

        peerMultijoueur.on('open', () => {
          connexionMultijoueur = peerMultijoueur.connect(PREFIXE_SALON + code);
          configurerConnexionMultijoueur();
        });

        peerMultijoueur.on('error', (erreur) => {
          if (erreur.type === 'peer-unavailable' && tentative < 6) {
            setTimeout(() => creerPeerJoueur(code, tentative + 1), 500);
          } else {
            console.error(erreur);
            afficherBadgeMultijoueur('⚠️ Connexion multijoueur impossible', 'badge-erreur');
          }
        });
      }

      function initMultijoueurDepuisSession() {
        const role = sessionStorage.getItem('mp_role');
        const code = sessionStorage.getItem('mp_code');
        if (!role || !code) return;

        afficherBadgeMultijoueur('⏳ Connexion avec l\'autre joueur...', 'badge-attente');
        initialiserModeMultijoueurJeu();

        if (role === 'hote') {
          creerPeerHote(code, 0);
        } else {
          creerPeerJoueur(code, 0);
        }
      }

      function couperEtRetourner(evenement) {
        evenement.preventDefault();

        if (connexionMultijoueur) {
          try { connexionMultijoueur.close(); } catch (erreur) { /* ignoré */ }
        }
        if (peerMultijoueur) {
          try { peerMultijoueur.destroy(); } catch (erreur) { /* ignoré */ }
        }

        sessionStorage.removeItem('mp_role');
        sessionStorage.removeItem('mp_code');

        window.location.href = './index.html';
      }

      // ---------- Recherche détaillée d'un pokémon (via PokeAPI) ----------

      const ROMAIN_VERS_NUM = {
        i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9
      };

      const TYPES_FR = {
        normal: 'Normal', fighting: 'Combat', flying: 'Vol', poison: 'Poison',
        ground: 'Sol', rock: 'Roche', bug: 'Insecte', ghost: 'Spectre',
        steel: 'Acier', fire: 'Feu', water: 'Eau', grass: 'Plante',
        electric: 'Électrik', psychic: 'Psy', ice: 'Glace', dragon: 'Dragon',
        dark: 'Ténèbres', fairy: 'Fée'
      };

      const COULEURS_FR = {
        black: 'Noir', blue: 'Bleu', brown: 'Marron', gray: 'Gris',
        green: 'Vert', pink: 'Rose', purple: 'Violet', red: 'Rouge',
        white: 'Blanc', yellow: 'Jaune'
      };

      const TYPE_COULEURS = {
        normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C',
        grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
        ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
        rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
        steel: '#B7B7CE', fairy: '#D685AD'
      };

      const TYPE_ICONES = {
        normal: '⚪', fire: '🔥', water: '💧', electric: '⚡', grass: '🌿',
        ice: '❄️', fighting: '👊', poison: '☠️', ground: '🌍', flying: '🪶',
        psychic: '👁️', bug: '🐛', rock: '🪨', ghost: '👻', dragon: '🐉',
        dark: '🌙', steel: '⚙️', fairy: '✨'
      };

      function normaliserTexte(texte) {
        return texte
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      function afficherErreurRecherche(message) {
        document.getElementById('rechercheErreurZone').innerHTML =
          `<p id="rechercheErreur">${message}</p>`;
      }

      // ---------- Autocomplétion ----------

      let listeReferencePokemons = [];

      function masquerSuggestions() {
        const listeSuggestions = document.getElementById('suggestionsListe');
        listeSuggestions.style.display = 'none';
        listeSuggestions.innerHTML = '';
      }

      async function afficherSuggestions() {
        const champ = document.getElementById('rechercheInput');
        const valeur = champ.value.trim();
        const listeSuggestions = document.getElementById('suggestionsListe');

        if (!valeur) {
          masquerSuggestions();
          return;
        }

        if (listeReferencePokemons.length === 0) {
          listeReferencePokemons = await chargerPokemons();
        }

        let resultats;
        if (/^\d+$/.test(valeur)) {
          resultats = listeReferencePokemons.filter(p => String(p.id).includes(valeur));
        } else {
          const valeurNorm = normaliserTexte(valeur);
          resultats = listeReferencePokemons.filter(p =>
            normaliserTexte(p.nom).includes(valeurNorm)
          );
          resultats.sort((a, b) => {
            const aCommence = normaliserTexte(a.nom).startsWith(valeurNorm) ? 0 : 1;
            const bCommence = normaliserTexte(b.nom).startsWith(valeurNorm) ? 0 : 1;
            return aCommence - bCommence;
          });
        }

        resultats = resultats.slice(0, 8);

        if (resultats.length === 0) {
          masquerSuggestions();
          return;
        }

        listeSuggestions.innerHTML = resultats.map(p => {
          const idFormate = String(p.id).padStart(3, '0');
          return `<div class="suggestion-item" onclick="choisirSuggestion(${p.id}, '${p.nom.replace(/'/g, "\\'")}')">${p.nom} <span class="num">#${idFormate}</span></div>`;
        }).join('');

        listeSuggestions.style.display = 'block';
      }

      function choisirSuggestion(id, nom) {
        document.getElementById('rechercheInput').value = nom;
        masquerSuggestions();
        lancerAffichageFiche(id, nom);
      }

      async function lancerAffichageFiche(id, nom) {
        document.getElementById('rechercheErreurZone').innerHTML = '';
        document.getElementById('ficheCorps').innerHTML =
          '<p class="fiche-chargement">Chargement des informations...</p>';
        try {
          await afficherFicheDetaillee(id, nom);
        } catch (erreur) {
          document.getElementById('ficheCorps').innerHTML = '';
          afficherErreurRecherche("Erreur lors de la récupération des informations.");
          console.error(erreur);
        }
      }

      async function rechercherPokemon() {
        const champ = document.getElementById('rechercheInput');
        const requete = champ.value.trim();
        document.getElementById('rechercheErreurZone').innerHTML = '';
        masquerSuggestions();

        if (!requete) return;

        try {
          const liste = await chargerPokemons();
          let pokemonTrouve = null;

          if (/^\d+$/.test(requete)) {
            const idRecherche = parseInt(requete, 10);
            pokemonTrouve = liste.find(p => p.id === idRecherche);
          } else {
            const requeteNorm = normaliserTexte(requete);
            pokemonTrouve = liste.find(p => normaliserTexte(p.nom) === requeteNorm)
              || liste.find(p => normaliserTexte(p.nom).includes(requeteNorm));
          }

          if (!pokemonTrouve) {
            document.getElementById('ficheCorps').innerHTML = '';
            afficherErreurRecherche(`Aucun pokémon trouvé pour « ${requete} ».`);
            return;
          }

          await lancerAffichageFiche(pokemonTrouve.id, pokemonTrouve.nom);
        } catch (erreur) {
          afficherErreurRecherche("Erreur lors de la recherche. Réessaie plus tard.");
          console.error(erreur);
        }
      }

      async function afficherFicheDetaillee(id, nomFr) {
        const dataPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(r => r.json());
        const dataEspece = await fetch(dataPokemon.species.url).then(r => r.json());

        // Génération
        const genRomain = dataEspece.generation.name.replace('generation-', '');
        const genNum = ROMAIN_VERS_NUM[genRomain] || genRomain;

        // Types
        const typesFr = dataPokemon.types
          .map(t => TYPES_FR[t.type.name] || t.type.name)
          .join(' / ');

        // Catégorie
        const genusEntree = dataEspece.genera.find(g => g.language.name === 'fr');
        const categorie = genusEntree ? genusEntree.genus : '—';

        // Taille / poids
        const tailleM = (dataPokemon.height / 10).toFixed(1);
        const poidsKg = (dataPokemon.weight / 10).toFixed(1);

        // Couleur
        const couleur = COULEURS_FR[dataEspece.color.name] || dataEspece.color.name;

        // Taux de capture
        const tauxCapture = dataEspece.capture_rate;

        // Cri
        const criUrl = dataPokemon.cries
          ? (dataPokemon.cries.latest || dataPokemon.cries.legacy)
          : null;

        // Description Pokédex (en français)
        const descriptionEntree = dataEspece.flavor_text_entries.find(
          f => f.language.name === 'fr'
        );
        const description = descriptionEntree
          ? descriptionEntree.flavor_text.replace(/[\n\f\r]/g, ' ')
          : '—';

        // Talents (avec traduction française)
        const talents = await Promise.all(
          dataPokemon.abilities.map(async a => {
            try {
              const detailTalent = await fetch(a.ability.url).then(r => r.json());
              const nomTalentFr = detailTalent.names.find(n => n.language.name === 'fr');
              const nom = nomTalentFr ? nomTalentFr.name : detailTalent.name;
              return nom + (a.is_hidden ? ' (Talent Caché)' : '');
            } catch {
              return a.ability.name;
            }
          })
        );

        // Groupes d'œuf (noms français récupérés directement depuis PokeAPI)
        const groupesOeufListe = await Promise.all(
          dataEspece.egg_groups.map(async g => {
            try {
              const detailGroupe = await fetch(g.url).then(r => r.json());
              const nomFrGroupe = detailGroupe.names.find(n => n.language.name === 'fr');
              return nomFrGroupe ? nomFrGroupe.name : detailGroupe.name;
            } catch {
              return g.name;
            }
          })
        );
        const groupesOeuf = groupesOeufListe.join(', ');

        // Lien vers la fiche Poképédia du pokémon
        const lienPokepedia = `https://www.pokepedia.fr/${nomFr.replace(/ /g, '_')}`;

        // Sensibilités (faiblesses / résistances / immunités selon les types du pokémon)
        const typesDetails = await Promise.all(
          dataPokemon.types.map(t => fetch(t.type.url).then(r => r.json()))
        );

        const multiplicateurs = {};
        Object.keys(TYPES_FR).forEach(t => { multiplicateurs[t] = 1; });

        typesDetails.forEach(detail => {
          const relations = detail.damage_relations;
          relations.double_damage_from.forEach(t => { multiplicateurs[t.name] *= 2; });
          relations.half_damage_from.forEach(t => { multiplicateurs[t.name] *= 0.5; });
          relations.no_damage_from.forEach(t => { multiplicateurs[t.name] *= 0; });
        });

        const formatMult = (m) => (m === 0.25 ? '¼' : m === 0.5 ? '½' : m);

        const ORDRE_TYPES_AFFICHAGE = [
          'normal', 'grass', 'fire', 'water', 'electric', 'ice', 'fighting',
          'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost',
          'dragon', 'dark', 'steel', 'fairy'
        ];

        const grilleTypesHtml = ORDRE_TYPES_AFFICHAGE.map(type => {
          const mult = multiplicateurs[type];
          const couleur = TYPE_COULEURS[type];
          const icone = TYPE_ICONES[type];
          const nomTypeFr = TYPES_FR[type];
          const multHtml = mult !== 1
            ? `<div class="type-badge-mult">× ${formatMult(mult)}</div>`
            : '';
          return `
            <div class="type-badge" style="background-color:${couleur};">
              <div class="type-badge-nom">${icone} ${nomTypeFr}</div>
              ${multHtml}
            </div>
          `;
        }).join('');

        // Statistiques de base
        const NOMS_STATS_FR = {
          hp: 'PV',
          attack: 'Attaque',
          defense: 'Défense',
          'special-attack': 'Attaque Spé',
          'special-defense': 'Défense Spé',
          speed: 'Vitesse'
        };

        const ORDRE_STATS = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];

        const statsParNom = {};
        dataPokemon.stats.forEach(s => { statsParNom[s.stat.name] = s.base_stat; });

        const totalStats = dataPokemon.stats.reduce((somme, s) => somme + s.base_stat, 0);

        const statsHtml = ORDRE_STATS.map(cle => {
          const valeur = statsParNom[cle] || 0;
          const pourcentage = Math.min(100, (valeur / 255) * 100);
          return `
            <div class="stat-ligne">
              <div class="stat-nom">${NOMS_STATS_FR[cle]} (${valeur})</div>
              <div class="stat-barre-fond">
                <div class="stat-barre-remplie" style="width:${pourcentage}%"></div>
              </div>
            </div>
          `;
        }).join('');

        // Sprite
        const spriteUrl = (dataPokemon.sprites && dataPokemon.sprites.front_default)
          || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

        const idFormate = String(dataEspece.id).padStart(3, '0');

        const criHtml = criUrl
          ? `<audio controls src="${criUrl}" style="width:100%; margin-top:5px;"></audio>`
          : '<span>Cri non disponible</span>';

        document.getElementById('ficheCorps').innerHTML = `
          <h2>${nomFr} <span style="color:#777; font-size:16px;">#${idFormate}</span></h2>
          <img class="sprite-fiche" src="${spriteUrl}" alt="${nomFr}">
          <div class="fiche-ligne"><strong>Génération :</strong> ${genNum}</div>
          <div class="fiche-ligne"><strong>Numéro de Pokédex :</strong> #${idFormate}</div>
          <div class="fiche-ligne"><strong>Type(s) :</strong> ${typesFr}</div>
          <div class="fiche-ligne"><strong>Catégorie :</strong> ${categorie}</div>
          <div class="fiche-ligne"><strong>Taille :</strong> ${tailleM} m</div>
          <div class="fiche-ligne"><strong>Poids :</strong> ${poidsKg} kg</div>
          <div class="fiche-ligne"><strong>Couleur :</strong> ${couleur}</div>
          <div class="fiche-ligne"><strong>Taux de capture :</strong> ${tauxCapture}</div>
          <div class="fiche-ligne"><strong>Cri :</strong><br>${criHtml}</div>
          <div class="fiche-ligne"><strong>Description Pokédex :</strong> ${description}</div>
          <div class="fiche-ligne"><strong>Talents :</strong> ${talents.join(', ')}</div>
          <div class="fiche-ligne"><strong>Groupe(s) d'Œuf :</strong> ${groupesOeuf}</div>
          <div class="fiche-ligne" style="text-align:center; margin-top:15px;">
            <a href="${lienPokepedia}" target="_blank" rel="noopener">📖 Voir la fiche complète sur Poképédia</a>
          </div>

          <div class="sensi-bloc">
            <div class="sensi-header">🛡️ Sensibilités</div>
            <div class="sensi-corps">
              <div class="types-grid">${grilleTypesHtml}</div>
            </div>
          </div>

          <div class="stats-bloc">
            <div class="stats-header">📊 Statistiques de base</div>
            <div class="stats-corps">
              ${statsHtml}
              <div class="stats-total">Total : ${totalStats}</div>
            </div>
          </div>
        `;
      }

      // Gestion des interactions de la barre de recherche
      document.addEventListener('DOMContentLoaded', () => {
        initMultijoueurDepuisSession();

        chargerGenerations().then(afficherFiltresGenerations);

        const champRecherche = document.getElementById('rechercheInput');
        if (champRecherche) {
          champRecherche.addEventListener('input', afficherSuggestions);

          champRecherche.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') rechercherPokemon();
          });
        }

        // Ferme la liste de suggestions si on clique ailleurs sur la page
        document.addEventListener('click', (e) => {
          const wrapper = document.querySelector('.recherche-wrapper');
          if (wrapper && !wrapper.contains(e.target)) {
            masquerSuggestions();
          }
        });
      });
    </script>
  </body>
</html>
