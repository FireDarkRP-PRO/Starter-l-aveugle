  <body>
    <a class="button" id="rulesBtn" href="./starterRules.html">📜 Règles</a>

    <div class="top-zone">
      <h1>Starter Pokémon à l'aveugle</h1>

        </div>
        <button id="rechercheBtn" onclick="rechercherPokemon()">🔍 Rechercher</button>

    <script>
      // Liste complète des pokémon, chargée une seule fois depuis le fichier BDD
      let allPokemons = [];

      async function chargerPokemons() {
        if (allPokemons.length > 0) return allPokemons;

        const reponse = await fetch('../BDD/pokemon.txt');
        const texte = await reponse.text();

        allPokemons = texte
          .split('\n')
          .map(ligne => ligne.trim())
          .filter(ligne => ligne.length > 0)
          .map(ligne => {
            const espace = ligne.indexOf(' ');
            const numero = ligne.substring(0, espace);
            const nom = ligne.substring(espace + 1).trim();
            return { id: parseInt(numero, 10), nom: nom };
          });

        return allPokemons;
      }

      // ---------- Formes régionales ----------
      // Chargées depuis ../BDD/formesRegionales.txt, format par ligne :
      //   idNationalDuPokemonDeBase;slugPokeAPIDeLaForme;nomAfficheDeLaForme
      // Les formes ne sont PAS ajoutées à allPokemons : ça leur donnerait plus
      // de chances d'être tirées que les autres pokémon. Un pokémon tiré qui a
      // des formes régionales peut ensuite garder sa forme normale ou en recevoir
      // une au hasard, chaque possibilité (normale incluse) ayant la même chance.
      let formesRegionalesParEspece = null;

      async function chargerFormesRegionales() {
        if (formesRegionalesParEspece) return formesRegionalesParEspece;
        formesRegionalesParEspece = {};

        try {
          const reponse = await fetch('../BDD/formesRegionales.txt');
          const texte = await reponse.text();

          texte
            .split('\n')
            .map(ligne => ligne.trim())
            .filter(ligne => ligne.length > 0 && !ligne.startsWith('#'))
            .forEach(ligne => {
              const [idBaseTexte, slug, nomAffiche] = ligne.split(';').map(v => v.trim());
              const idBase = parseInt(idBaseTexte, 10);
              if (!formesRegionalesParEspece[idBase]) formesRegionalesParEspece[idBase] = [];
              formesRegionalesParEspece[idBase].push({ slug, nomAffiche });
            });
        } catch (erreur) {
          console.error('Impossible de charger ../BDD/formesRegionales.txt', erreur);
        }

        return formesRegionalesParEspece;
      }

      // Pour chaque pokémon tiré : s'il a au moins une forme régionale connue,
      // on tire au hasard soit sa forme normale, soit une de ses formes régionales
      // (chaque forme, normale incluse, a la même probabilité d'être choisie).
      let formesRegionalesActives = true; // case "Formes régionales" (synchronisée en multijoueur)

      function appliquerOptionFormes(actif) {
        formesRegionalesActives = actif;
        const caseFormes = document.getElementById('formesRegionalesCheckbox');
        if (caseFormes) caseFormes.checked = actif;
      }

      function changerOptionFormes() {
        formesRegionalesActives = document.getElementById('formesRegionalesCheckbox').checked;
        if (modeMultijoueur) {
          envoyerMessage({ type: 'optionFormes', actif: formesRegionalesActives });
        }
      }

      // ---------- Légendaires / Fabuleux ----------
      // Ces pokémon sont aussi présents dans pokemon.txt : décocher une case les retire
      // simplement de la liste dans laquelle on tire (ils ne sont donc jamais tirés,
      // et leurs formes régionales non plus).
      let inclureNormaux = true;
      let inclureLegendaires = true;
      let inclureFabuleux = true;
      const idsCategories = {}; // nom de fichier -> Set d'identifiants

      async function chargerIdsCategorie(nomFichier) {
        if (idsCategories[nomFichier]) return idsCategories[nomFichier];

        // Le nom contient un accent : on essaie les deux écritures Unicode possibles
        const variantes = [...new Set([nomFichier, nomFichier.normalize('NFC'), nomFichier.normalize('NFD')])];
        let texte = null;

        for (const nom of variantes) {
          try {
            const reponse = await fetch('../BDD/' + encodeURIComponent(nom));
            if (reponse.ok) { texte = await reponse.text(); break; }
          } catch (erreur) { /* on essaie la variante suivante */ }
        }

        const ids = new Set();
        if (texte === null) {
          console.error(`Impossible de charger ../BDD/${nomFichier}`);
        } else {
          texte.split('\n').map(l => l.trim()).filter(l => l.length > 0).forEach(ligne => {
            const id = parseInt(ligne.split(' ')[0], 10);
            if (!isNaN(id)) ids.add(id);
          });
          idsCategories[nomFichier] = ids; // on ne mémorise que les chargements réussis
        }
        return ids;
      }

      function appliquerOptionCategories(legendaires, fabuleux, normaux) {
        inclureLegendaires = legendaires;
        inclureFabuleux = fabuleux;
        inclureNormaux = normaux;
        const caseN = document.getElementById('normauxCheckbox');
        if (caseN) caseN.checked = normaux;
        const caseL = document.getElementById('legendairesCheckbox');
        const caseF = document.getElementById('fabuleuxCheckbox');
        if (caseL) caseL.checked = legendaires;
        if (caseF) caseF.checked = fabuleux;
        mettreAJourCompteur();
      }

      function changerOptionCategories() {
        inclureNormaux = document.getElementById('normauxCheckbox').checked;
        inclureLegendaires = document.getElementById('legendairesCheckbox').checked;
        inclureFabuleux = document.getElementById('fabuleuxCheckbox').checked;
        mettreAJourCompteur();
        if (modeMultijoueur) {
          envoyerMessage({ type: 'optionCategories', legendaires: inclureLegendaires, fabuleux: inclureFabuleux, normaux: inclureNormaux });
        }
      }

      async function appliquerFormesRegionales(pokemons) {
        if (!formesRegionalesActives) return pokemons;

        const formes = await chargerFormesRegionales();

        return Promise.all(pokemons.map(async p => {
          const formesDispo = formes[p.id];
          if (!formesDispo || formesDispo.length === 0) return p;

          const options = [null, ...formesDispo]; // null = forme normale
          const forme = options[Math.floor(Math.random() * options.length)];

          if (!forme) return p;

          try {
            const dataForme = await fetch(`https://pokeapi.co/api/v2/pokemon/${forme.slug}`).then(r => r.json());
            return {
              id: dataForme.id,
              nom: forme.nomAffiche,
              idAffiche: String(p.id).padStart(3, '0'),
              spriteUrl: dataForme.sprites && dataForme.sprites.front_default
            };
          } catch (erreur) {
            console.error(`Impossible de charger la forme régionale "${forme.slug}"`, erreur);
            return p;
          }
        }));
      }

      // Renvoie le numéro à afficher et le sprite à utiliser pour un pokémon,
      // qu'il s'agisse d'un pokémon normal ou d'une forme régionale.
      function infosAffichagePokemon(p) {
        return {
          idFormate: p.idAffiche || String(p.id).padStart(3, '0'),
          spriteUrl: p.spriteUrl || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`
        };
      }

      // ---------- Filtre par génération ----------

      let listeGenerations = [];

      async function chargerGenerations() {
        if (listeGenerations.length > 0) return listeGenerations;

        const reponse = await fetch('../BDD/genPokemon.txt');
        const texte = await reponse.text();

        listeGenerations = texte
          .split('\n')
          .map(ligne => ligne.trim())
          .filter(ligne => ligne.length > 0)
          .map(ligne => {
            const [nomGen, plage] = ligne.split(':');
            const [min, max] = plage.split('-').map(n => parseInt(n, 10));
            const numero = parseInt(nomGen.replace(/\D/g, ''), 10);
            return { numero, nom: nomGen, min, max };
          });

        return listeGenerations;
      }

      function afficherFiltresGenerations(generations) {
        const conteneur = document.getElementById('filtresGenerations');
        conteneur.innerHTML = generations.map(g => `
          <label class="gen-case">
            <input type="checkbox" class="gen-checkbox" value="${g.numero}" checked>
            ${g.nom}
          </label>
        `).join('');

        document.querySelectorAll('.gen-checkbox').forEach(cb => {
          cb.addEventListener('change', envoyerSelectionGenerations);
        });

        if (generationsChoisies) appliquerSelectionGenerations(generationsChoisies);
        mettreAJourCompteur();
      }

      function basculerToutesGenerations(cocher) {
        document.querySelectorAll('.gen-checkbox').forEach(cb => { cb.checked = cocher; });
        envoyerSelectionGenerations();
      }

      let generationsChoisies = null; // mémorisées pour survivre à un rechargement de la page

      function envoyerSelectionGenerations() {
        const numerosSelectionnes = [...document.querySelectorAll('.gen-checkbox:checked')]
          .map(cb => parseInt(cb.value, 10));
        generationsChoisies = numerosSelectionnes;
        mettreAJourCompteur();
        if (modeMultijoueur) {
          envoyerMessage({ type: 'selectionGen', generations: numerosSelectionnes });
        }
      }

      function appliquerSelectionGenerations(numerosSelectionnes) {
        generationsChoisies = numerosSelectionnes;
        document.querySelectorAll('.gen-checkbox').forEach(cb => {
          cb.checked = numerosSelectionnes.includes(parseInt(cb.value, 10));
        });
        mettreAJourCompteur();
      }

      async function obtenirPokemonsFiltresParGeneration() {
        const liste = await chargerPokemons();
        const generations = await chargerGenerations();

        const numerosSelectionnes = [...document.querySelectorAll('.gen-checkbox:checked')]
          .map(cb => parseInt(cb.value, 10));

        if (numerosSelectionnes.length === 0) {
          return [];
        }

        const plagesSelectionnees = generations.filter(g => numerosSelectionnes.includes(g.numero));

        const toutesCategories = inclureNormaux && inclureLegendaires && inclureFabuleux;
        if (!inclureNormaux && !inclureLegendaires && !inclureFabuleux) {
          return []; // aucune catégorie sélectionnée : rien à tirer
        }

        // Pas besoin de lire les fichiers si les trois catégories sont cochées
        const idsLegendaires = toutesCategories ? new Set() : await chargerIdsCategorie('legendaires.txt');
        const idsFabuleux = toutesCategories ? new Set() : await chargerIdsCategorie('Pokémon_Fabuleux.txt');

        return liste.filter(p => {
          if (!plagesSelectionnees.some(g => p.id >= g.min && p.id <= g.max)) return false;
          if (toutesCategories) return true;

          const estLegendaire = idsLegendaires.has(p.id);
          const estFabuleux = idsFabuleux.has(p.id);

          if (!estLegendaire && !estFabuleux) return inclureNormaux;
          return (estLegendaire && inclureLegendaires) || (estFabuleux && inclureFabuleux);
        });
      }

      // Message affiché quand le tirage n'a aucun pokémon à piocher
      function messageAucunPokemon() {
        if (!inclureNormaux && !inclureLegendaires && !inclureFabuleux) {
          return 'Sélectionne au moins une catégorie (normaux, légendaires ou fabuleux) avant de tirer.';
        }
        if (document.querySelectorAll('.gen-checkbox:checked').length === 0) {
          return 'Sélectionne au moins une génération avant de tirer.';
        }
        return 'Aucun pokémon ne correspond à tes filtres (générations, catégories).';
      }

      // Affiche combien de pokémon contient la liste de tirage avec les filtres actuels
      // (générations + catégories). Les formes régionales ne comptent pas : elles ne sont
      // pas ajoutées à la liste, elles remplacent seulement la forme du pokémon tiré.
      let jetonCompteur = 0;

      async function mettreAJourCompteur() {
        const zone = document.getElementById('compteurListe');
        if (!zone) return;

        const jeton = ++jetonCompteur;
        try {
          const n = (await obtenirPokemonsFiltresParGeneration()).length;
          if (jeton !== jetonCompteur) return; // un calcul plus récent a pris le relais
          zone.textContent = n === 0
            ? '📋 Aucun pokémon dans la liste de tirage'
            : `📋 ${n} pokémon dans la liste de tirage`;
        } catch (erreur) {
          if (jeton === jetonCompteur) zone.textContent = '';
          console.error('Impossible de compter les pokémon', erreur);
        }
      }

      function choisirPokemonsAleatoires(liste, quantite) {
        const indicesChoisis = new Set();
        while (indicesChoisis.size < quantite && indicesChoisis.size < liste.length) {
          indicesChoisis.add(Math.floor(Math.random() * liste.length));
        }
        return [...indicesChoisis].map(i => liste[i]);
      }

      function afficherPokemons(pokemons) {
        const container = document.getElementById('pokemonContainer');
        container.innerHTML = '';

        pokemons.forEach(p => {
          const carte = document.createElement('div');
          carte.className = 'pokemon-card';
          carte.title = 'Cliquer pour voir sa fiche';
          carte.onclick = () => {
            document.getElementById('rechercheInput').value = p.nom;
            document.getElementById('rechercheInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            lancerAffichageFiche(p.id, p.nom);
          };

          const { idFormate, spriteUrl } = infosAffichagePokemon(p);

          carte.innerHTML = `
            <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
            <p>${p.nom}</p>
            <span class="num">#${idFormate}</span>
          `;

          container.appendChild(carte);
        });
      }

      async function tirerPokemons() {
        if (modeMultijoueur) {
          return tirerPokemonsMultijoueur();
        }

        const container = document.getElementById('pokemonContainer');
        try {
          const listeFiltree = await obtenirPokemonsFiltresParGeneration();

          if (listeFiltree.length === 0) {
            container.innerHTML = '<p id="erreurMsg">' + messageAucunPokemon() + '</p>';
            return;
          }

          const pokemonsTires = await appliquerFormesRegionales(choisirPokemonsAleatoires(listeFiltree, 3));
          afficherPokemons(pokemonsTires);
        } catch (erreur) {
          container.innerHTML = '<p id="erreurMsg">Impossible de charger la liste des pokémon (../BDD/pokemon.txt ou ../BDD/genPokemon.txt).</p>';
          console.error(erreur);
        }
      }

      // ================= Mode multijoueur : tour par tour =================

      let modeMultijoueur = false;
      let monRoleJeu = null;            // 'hote' | 'joueur'
      let tourDe = 'hote';              // à qui de tirer actuellement
      let tirageActuel = [];            // les 3 pokémon du round en cours
      let tirageEffectue = false;       // un tirage a-t-il été fait ce round ?
      let indicesEnvoyes = false;
      let indicesActuels = ['', '', ''];
      let choixEffectue = false;        // le joueur qui devine a-t-il choisi ?
      let indexChoisi = null;
      let revelesTableau = [false, false, false];
      let equipes = { hote: [], joueur: [] };
      let indicesCris = [null, null, null]; // URL du cri si l'indice est un cri (sinon null)
      let indiceCriActif = false;           // mode "cri" sélectionné dans le menu (côté lanceur)
      let indicesSilhouettes = [null, null, null]; // silhouette noire (data:image/png) si l'indice est une silhouette
      let indiceSilhouetteActif = false;    // mode "silhouette" sélectionné dans le menu (côté lanceur)
      let partieTerminee = false;
      let idPartie = '';

      function estMonTour() {
        return monRoleJeu === tourDe;
      }

      // Le joueur qui doit deviner (ce n'est pas son tour de tirer) ne doit
      // pas pouvoir chercher le pokémon lui-même pendant qu'il attend/choisit :
      // ça reviendrait à tricher. On masque et on désactive la barre de
      // recherche dans ce cas, et on la réaffiche dès que c'est à nouveau son
      // tour de tirer.
      function mettreAJourVisibiliteRecherche(masquer) {
        const zone = document.querySelector('.zone-recherche');
        if (!zone) return;

        zone.style.display = masquer ? 'none' : '';
        document.getElementById('rechercheInput').disabled = masquer;
        document.getElementById('rechercheBtn').disabled = masquer;

        if (masquer) {
          document.getElementById('rechercheInput').value = '';
          document.getElementById('suggestionsListe').innerHTML = '';
          document.getElementById('rechercheErreurZone').innerHTML = '';
          document.getElementById('ficheCorps').innerHTML = '';
        }
      }

      function basculerTour() {
        tourDe = (tourDe === 'hote') ? 'joueur' : 'hote';
      }

      function reinitialiserRoundMultijoueur() {
        tirageActuel = [];
        tirageEffectue = false;
        indicesEnvoyes = false;
        indicesActuels = ['', '', ''];
        choixEffectue = false;
        indexChoisi = null;
        revelesTableau = [false, false, false];
        indicesCris = [null, null, null];
        indiceCriActif = false;
        indicesSilhouettes = [null, null, null];
        indiceSilhouetteActif = false;
        Object.keys(donneesPokemonIndiceCache).forEach(cle => delete donneesPokemonIndiceCache[cle]);
      }

      // ---------- Indices prédéfinis ----------
      // Une règle sélectionnée dans le menu déroulant PRÉ-REMPLIT les 3 zones de
      // texte avec la vraie valeur correspondante pour chaque pokémon, mais ne
      // les envoie jamais toute seule : le joueur reste libre de modifier le
      // texte avant de cliquer sur "Envoyer les indices".
      const reglesIndicesPredefinies = {
        generation: 'Génération',
        numero: 'Numéro de Pokédex',
        types: 'Types',
        categorie: 'Catégorie',
        taille: 'Taille',
        poids: 'Poids',
        couleur: 'Couleur',
        capture: 'Taux de capture',
        description: 'Description Pokédex',
        talents: 'Talents',
        groupesOeuf: "Groupes d'Œuf",
        cri: '🔊 Cri du pokémon (remplace le texte)',
        silhouette: '🕶️ Silhouette du pokémon (remplace le texte)'
      };

      const typesEnFrancais = {
        normal: 'Normal', fire: 'Feu', water: 'Eau', electric: 'Électrik', grass: 'Plante',
        ice: 'Glace', fighting: 'Combat', poison: 'Poison', ground: 'Sol', flying: 'Vol',
        psychic: 'Psy', bug: 'Insecte', rock: 'Roche', ghost: 'Spectre', dragon: 'Dragon',
        dark: 'Ténèbres', steel: 'Acier', fairy: 'Fée'
      };

      const couleursEnFrancais = {
        black: 'Noir', blue: 'Bleu', brown: 'Marron', gray: 'Gris', green: 'Vert',
        pink: 'Rose', purple: 'Violet', red: 'Rouge', white: 'Blanc', yellow: 'Jaune'
      };

      const donneesPokemonIndiceCache = {};

      async function recupererDonneesIndice(p) {
        if (donneesPokemonIndiceCache[p.id]) return donneesPokemonIndiceCache[p.id];

        const dataPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${p.id}`).then(r => r.json());
        const dataEspece = await fetch(dataPokemon.species.url).then(r => r.json());

        const donnees = { dataPokemon, dataEspece };
        donneesPokemonIndiceCache[p.id] = donnees;
        return donnees;
      }

      async function genererTexteIndicePredefini(p, regle) {
        const { dataPokemon, dataEspece } = await recupererDonneesIndice(p);

        switch (regle) {
          case 'generation': {
            const chiffresRomains = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9 };
            const numero = dataEspece.generation.name.split('-')[1];
            return `Génération ${chiffresRomains[numero] || numero}`;
          }
          case 'numero':
            return `N° ${String(dataEspece.id).padStart(3, '0')}`;
          case 'types':
            return dataPokemon.types.map(t => typesEnFrancais[t.type.name] || t.type.name).join(' / ');
          case 'categorie': {
            const genre = dataEspece.genera.find(g => g.language.name === 'fr');
            return genre ? genre.genus : '(catégorie inconnue)';
          }
          case 'taille':
            return `${(dataPokemon.height / 10).toLocaleString('fr-FR')} m`;
          case 'poids':
            return `${(dataPokemon.weight / 10).toLocaleString('fr-FR')} kg`;
          case 'couleur':
            return couleursEnFrancais[dataEspece.color.name] || dataEspece.color.name;
          case 'capture':
            return `Taux de capture : ${dataEspece.capture_rate}/255`;
          case 'description': {
            const entree = dataEspece.flavor_text_entries.find(e => e.language.name === 'fr')
              || dataEspece.flavor_text_entries.find(e => e.language.name === 'en');
            return entree ? entree.flavor_text.replace(/[\n\f\r]/g, ' ') : '(description indisponible)';
          }
          case 'talents': {
            const talents = await Promise.all(dataPokemon.abilities.map(async a => {
              const dataTalent = await fetch(a.ability.url).then(r => r.json());
              const nomFr = dataTalent.names.find(n => n.language.name === 'fr');
              const nom = nomFr ? nomFr.name : a.ability.name;
              return a.is_hidden ? `${nom} (caché)` : nom;
            }));
            return talents.join(', ');
          }
          case 'groupesOeuf': {
            const groupes = await Promise.all(dataEspece.egg_groups.map(async g => {
              const dataGroupe = await fetch(g.url).then(r => r.json());
              const nomFr = dataGroupe.names.find(n => n.language.name === 'fr');
              return nomFr ? nomFr.name : g.name;
            }));
            return groupes.join(', ');
          }
          default:
            return '';
        }
      }

      async function appliquerRegleIndice() {
        const select = document.getElementById('regleIndicePredefinie');
        const regle = select.value;

        // Le cri remplace la zone de texte par un lecteur audio
        if (regle === 'cri') {
          await activerModeCri(select);
          return;
        }

        // La silhouette remplace aussi la zone de texte, par une image noire
        if (regle === 'silhouette') {
          await activerModeSilhouette(select);
          return;
        }

        // Toute autre règle (ou aucune) : on revient aux zones de texte
        if (indiceCriActif) desactiverModeCri();
        if (indiceSilhouetteActif) desactiverModeSilhouette();
        if (!regle) return;

        select.disabled = true;

        await Promise.all(tirageActuel.map(async (p, i) => {
          const champ = document.getElementById('indiceTexte-' + i);
          if (!champ) return;
          const valeurPrecedente = champ.value;
          champ.value = '⏳ ...';
          try {
            champ.value = await genererTexteIndicePredefini(p, regle);
          } catch (erreur) {
            console.error('Impossible de générer un indice prédéfini', erreur);
            champ.value = valeurPrecedente;
          }
        }));

        select.disabled = false;
      }

      // ---------- Indice "Cri" ----------
      // Le cri n'est pas copié dans le texte : on envoie son URL (fichier du dépôt
      // PokeAPI/cries) et l'autre joueur le charge et le joue chez lui.

      function urlCriValide(url) {
        return typeof url === 'string' && url.startsWith('https://raw.githubusercontent.com/PokeAPI/');
      }

      async function recupererUrlCri(p) {
        const { dataPokemon, dataEspece } = await recupererDonneesIndice(p);

        let cries = dataPokemon.cries;
        let url = cries && (cries.latest || cries.legacy);

        // Certaines formes n'ont pas de cri propre : on prend celui de la forme de base
        if (!url && dataEspece && dataEspece.varieties) {
          const defaut = dataEspece.varieties.find(v => v.is_default);
          if (defaut) {
            const dataDefaut = await fetch(defaut.pokemon.url).then(r => r.json());
            cries = dataDefaut.cries;
            url = cries && (cries.latest || cries.legacy);
          }
        }

        return urlCriValide(url) ? url : null;
      }

      async function activerModeCri(select) {
        if (indiceSilhouetteActif) desactiverModeSilhouette();
        select.disabled = true;
        indiceCriActif = true;
        indicesCris = [null, null, null];
        afficherCriDansZones(true);

        await Promise.all(tirageActuel.map(async (p, i) => {
          try {
            indicesCris[i] = await recupererUrlCri(p);
          } catch (erreur) {
            console.error('Impossible de récupérer le cri', erreur);
            indicesCris[i] = null;
          }
        }));

        select.disabled = false;
        afficherCriDansZones(false);
      }

      function desactiverModeCri() {
        indiceCriActif = false;
        indicesCris = [null, null, null];
        afficherCriDansZones(false);
      }

      // Côté lanceur, avant l'envoi : masque la zone de texte et affiche le lecteur de cri
      function afficherCriDansZones(chargement) {
        [0, 1, 2].forEach(i => {
          const champ = document.getElementById('indiceTexte-' + i);
          const zoneCri = document.getElementById('indiceCri-' + i);
          if (!champ || !zoneCri) return;

          if (!indiceCriActif) {
            champ.style.display = '';
            zoneCri.style.display = 'none';
            zoneCri.innerHTML = '';
            return;
          }

          zoneCri.style.display = '';

          if (chargement) {
            champ.style.display = 'none';
            zoneCri.innerHTML = '<p class="note-cri">⏳ Chargement du cri...</p>';
          } else if (indicesCris[i]) {
            champ.style.display = 'none';
            zoneCri.innerHTML = `
              <button type="button" class="btn-cri" data-cri="${i}" onclick="jouerCri(${i}, event)">🔊 Écouter le cri</button>
              <p class="note-cri">Le cri sera envoyé à la place d'un texte</p>
            `;
          } else {
            champ.style.display = '';
            zoneCri.innerHTML = '<p class="note-cri">⚠️ Cri indisponible pour ce pokémon : écris un indice à la place</p>';
          }
        });
      }

      // ---------- Indice "Silhouette" ----------
      // La silhouette est fabriquée CHEZ LE LANCEUR : on dessine le sprite dans un
      // canvas, on passe tous les pixels visibles en noir, puis on n'envoie que cette
      // image noire (data:image/png). L'autre joueur ne reçoit jamais l'URL du vrai
      // sprite pour cet indice : même en ouvrant l'image dans un autre onglet ou en
      // la faisant glisser, il ne peut obtenir que la silhouette.

      // Taille max d'une silhouette envoyée (en caractères). Les messages passent en JSON
      // sans découpage : au-delà d'environ 16 Ko, le canal de données peut se couper.
      const TAILLE_MAX_SILHOUETTE = 12000;

      function silhouetteValide(url) {
        return typeof url === 'string'
          && url.length <= TAILLE_MAX_SILHOUETTE
          && /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(url);
      }

      function chargerImageCors(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous'; // nécessaire pour pouvoir lire les pixels du canvas
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Image introuvable : ' + url));
          img.src = url;
        });
      }

      async function creerSilhouette(p) {
        const { spriteUrl } = infosAffichagePokemon(p);
        const img = await chargerImageCors(spriteUrl);

        // Même sprite que sur le site, agrandi avec lissage pour que la silhouette
        // ne soit pas pixelisée. Le message est envoyé en JSON sans découpage : il doit
        // rester léger (un message trop gros fait tomber la connexion), donc ×2 au
        // maximum, et ×1 si l'image est quand même trop lourde.
        let url = dessinerSilhouette(img, 2);
        if (!url || url.length > TAILLE_MAX_SILHOUETTE) url = dessinerSilhouette(img, 1);
        return (url && url.length <= TAILLE_MAX_SILHOUETTE && silhouetteValide(url)) ? url : null;
      }

      function dessinerSilhouette(img, echelle) {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth * echelle;
        canvas.height = img.naturalHeight * echelle;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // On garde la transparence d'origine (bords doux) : seule la couleur passe en noir
        const donnees = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = donnees.data;
        for (let k = 0; k < px.length; k += 4) {
          px[k] = 0; px[k + 1] = 0; px[k + 2] = 0;
        }
        ctx.putImageData(donnees, 0, 0);

        return canvas.toDataURL('image/png');
      }

      function silhouetteHtml(url) {
        return `<span class="indice-silhouette" oncontextmenu="return false" ondragstart="return false"><img src="${url}" alt="Silhouette" draggable="false"></span>`;
      }

      async function activerModeSilhouette(select) {
        if (indiceCriActif) desactiverModeCri();
        select.disabled = true;
        indiceSilhouetteActif = true;
        indicesSilhouettes = [null, null, null];
        afficherSilhouetteDansZones(true);

        await Promise.all(tirageActuel.map(async (p, i) => {
          try {
            indicesSilhouettes[i] = await creerSilhouette(p);
          } catch (erreur) {
            console.error('Impossible de créer la silhouette', erreur);
            indicesSilhouettes[i] = null;
          }
        }));

        select.disabled = false;
        if (!indiceSilhouetteActif) return;
        afficherSilhouetteDansZones(false);
      }

      function desactiverModeSilhouette() {
        indiceSilhouetteActif = false;
        indicesSilhouettes = [null, null, null];
        afficherSilhouetteDansZones(false);
      }

      // Côté lanceur, avant l'envoi : masque la zone de texte et affiche la silhouette
      function afficherSilhouetteDansZones(chargement) {
        [0, 1, 2].forEach(i => {
          const champ = document.getElementById('indiceTexte-' + i);
          const zone = document.getElementById('indiceSilhouette-' + i);
          if (!champ || !zone) return;

          if (!indiceSilhouetteActif) {
            champ.style.display = '';
            zone.style.display = 'none';
            zone.innerHTML = '';
            return;
          }

          zone.style.display = '';

          if (chargement) {
            champ.style.display = 'none';
            zone.innerHTML = '<p class="note-cri">⏳ Création de la silhouette...</p>';
          } else if (indicesSilhouettes[i]) {
            champ.style.display = 'none';
            zone.innerHTML = `
              ${silhouetteHtml(indicesSilhouettes[i])}
              <p class="note-cri">La silhouette sera envoyée à la place d'un texte</p>
            `;
          } else {
            champ.style.display = '';
            zone.innerHTML = '<p class="note-cri">⚠️ Silhouette indisponible pour ce pokémon : écris un indice à la place</p>';
          }
        });
      }

      let audioCriEnCours = null;

      function jouerCri(i, evenement) {
        if (evenement) evenement.stopPropagation(); // ne pas déclencher le choix de la boîte noire

        const url = indicesCris[i];
        if (!url) return;

        if (audioCriEnCours) {
          try { audioCriEnCours.pause(); } catch (erreur) { /* ignoré */ }
        }

        const boutons = document.querySelectorAll(`[data-cri="${i}"]`);
        const marquer = (texte) => boutons.forEach(b => { b.textContent = texte; });

        const audio = new Audio(url);
        audioCriEnCours = audio;
        audio.addEventListener('error', () => marquer('⚠️ Cri indisponible — réessayer'));
        audio.addEventListener('ended', () => marquer('🔊 Écouter le cri'));

        marquer('🔊 Écouter le cri');
        audio.play().catch(erreur => {
          console.error('Lecture du cri impossible', erreur);
          marquer('⚠️ Cri indisponible — réessayer');
        });
      }

      function echapperHtml(texte) {
        return String(texte == null ? '' : texte).replace(/[&<>"']/g, c => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }

      // HTML d'un indice (texte ou cri) pour le pokémon i
      function indiceHtml(i, texteSiVide) {
        if (indicesSilhouettes[i]) {
          return silhouetteHtml(indicesSilhouettes[i]);
        }
        if (indicesCris[i]) {
          return `<span class="indice-cri" onclick="event.stopPropagation()"><button type="button" class="btn-cri" data-cri="${i}" onclick="jouerCri(${i}, event)">🔊 Écouter le cri</button></span>`;
        }
        return `💬 ${echapperHtml(indicesActuels[i]) || texteSiVide}`;
      }

      function initialiserModeMultijoueurJeu() {
        modeMultijoueur = true;
        monRoleJeu = sessionStorage.getItem('mp_role') === 'hote' ? 'hote' : 'joueur';
        idPartie = sessionStorage.getItem('mp_partie') || '';
        tourDe = 'hote';
        reinitialiserRoundMultijoueur();

        // Si la page a été rechargée en pleine partie, on reprend là où on en était
        const restaure = restaurerEtat();

        afficherMiniEquipes();
        if (restaure && partieTerminee) {
          afficherEquipesFinales();
        } else {
          rafraichirVueMultijoueur();
        }
      }

      async function tirerPokemonsMultijoueur() {
        if (!estMonTour() || tirageEffectue) return;

        const listeFiltree = await obtenirPokemonsFiltresParGeneration();
        if (listeFiltree.length === 0) {
          document.getElementById('pokemonContainer').innerHTML =
            '<p id="erreurMsg">' + messageAucunPokemon() + '</p>';
          return;
        }

        tirageActuel = await appliquerFormesRegionales(choisirPokemonsAleatoires(listeFiltree, 3));
        tirageEffectue = true;

        envoyerMessage({ type: 'tirage', pokemons: tirageActuel });

        rafraichirVueMultijoueur();
      }

      function envoyerIndices() {
        indicesCris = [0, 1, 2].map(i => (indiceCriActif && urlCriValide(indicesCris[i])) ? indicesCris[i] : null);
        indicesSilhouettes = [0, 1, 2].map(i => (indiceSilhouetteActif && silhouetteValide(indicesSilhouettes[i])) ? indicesSilhouettes[i] : null);
        indicesActuels = [0, 1, 2].map(i => {
          if (indicesCris[i] || indicesSilhouettes[i]) return ''; // indice = cri ou silhouette : pas de texte
          const champ = document.getElementById('indiceTexte-' + i);
          return champ ? champ.value.trim() : '';
        });
        indicesEnvoyes = true;

        // Chaque silhouette part dans son propre petit message (reçus dans l'ordre),
        // puis le message d'indices, qui ne contient plus que du texte.
        indicesSilhouettes.forEach((url, i) => {
          if (url) envoyerMessage({ type: 'silhouette', index: i, data: url });
        });
        envoyerMessage({ type: 'indices', textes: indicesActuels, cris: indicesCris });

        rafraichirVueActive();
      }

      function reveler(i) {
        if (revelesTableau[i]) return;
        revelesTableau[i] = true;

        envoyerMessage({ type: 'reveal', index: i });

        rafraichirVueActive();
      }

      function terminerTour() {
        envoyerMessage({ type: 'finTour' });
        finDuTour();
      }

      // Appelée localement (bouton "Terminer mon tour") ET à la réception du message 'finTour'.
      // C'est le seul moment où l'affichage des équipes et la vérification de fin de partie ont lieu,
      // pour éviter qu'un joueur voie un pokémon avant que l'autre ne l'ait révélé.
      function finDuTour() {
        basculerTour();
        reinitialiserRoundMultijoueur();
        afficherMiniEquipes();

        if (equipes.hote.length >= 6 && equipes.joueur.length >= 6) {
          afficherEquipesFinales();
        } else {
          rafraichirVueMultijoueur();
        }

        sauvegarderEtat();
      }

      function tenterChoix(i) {
        if (choixEffectue) return;

        const confirmation = confirm('Confirmes-tu ton choix ? Cette action est définitive.');
        if (!confirmation) return;

        indexChoisi = i;
        choixEffectue = true;
        equipes[monRoleJeu].push(tirageActuel[i]);

        envoyerMessage({ type: 'choix', index: i, role: monRoleJeu });

        rafraichirVueMultijoueur();
      }

      function rafraichirVueMultijoueur() {
        if (!modeMultijoueur) return;

        if (estMonTour()) {
          rafraichirVueActive();
        } else {
          rafraichirVueAttente();
        }
      }

      function genererMiniListe(liste) {
        if (liste.length === 0) {
          return '<p class="mini-liste-vide">Aucun pokémon pour l\'instant</p>';
        }

        return liste.map(p => {
          const { spriteUrl } = infosAffichagePokemon(p);
          return `
            <div class="mini-pokemon">
              <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
              <div>${p.nom}</div>
            </div>
          `;
        }).join('');
      }

      function afficherMiniEquipes() {
        const autreRoleJeu = monRoleJeu === 'hote' ? 'joueur' : 'hote';

        const gauche = document.getElementById('equipeGaucheZone');
        const droite = document.getElementById('equipeDroiteZone');

        gauche.classList.add('actif');
        droite.classList.add('actif');

        gauche.innerHTML = `<div class="colonne-titre">Ton équipe</div><div class="mini-liste">${genererMiniListe(equipes[monRoleJeu])}</div>`;
        droite.innerHTML = `<div class="colonne-titre">Adversaire</div><div class="mini-liste">${genererMiniListe(equipes[autreRoleJeu])}</div>`;
      }

      function rafraichirVueActive() {
        mettreAJourVisibiliteRecherche(false);

        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-connecte">🎯 C\'est ton tour !</span>';

        const boutonTirage = document.getElementById('tirageBtn');
        const zoneActions = document.getElementById('zoneActionsMultijoueur');

        if (!tirageEffectue) {
          boutonTirage.style.display = 'inline-block';
          boutonTirage.disabled = false;
          document.getElementById('pokemonContainer').innerHTML = '';
          zoneActions.innerHTML = '';
          return;
        }

        boutonTirage.style.display = 'none';

        afficherPokemons(tirageActuel);

        const cartes = document.querySelectorAll('#pokemonContainer .pokemon-card');
        cartes.forEach((carte, i) => {
          const zone = document.createElement('div');
          zone.className = 'zone-indice';
          zone.onclick = (e) => e.stopPropagation();

          if (!indicesEnvoyes) {
            zone.innerHTML = `
              <textarea class="indice-texte" id="indiceTexte-${i}" placeholder="Indice pour ce pokémon..."></textarea>
              <div id="indiceCri-${i}" style="display:none;"></div>
              <div id="indiceSilhouette-${i}" style="display:none;"></div>
            `;
          } else if (!choixEffectue) {
            zone.innerHTML = `<p class="indice-envoye">${indiceHtml(i, '(vide)')}</p>`;
          } else {
            const marque = (i === indexChoisi) ? ' ⭐' : '';
            const indiceAffiche = `<p class="indice-envoye">${indiceHtml(i, '(vide)')}</p>`;
            zone.innerHTML = revelesTableau[i]
              ? `${indiceAffiche}<p class="indice-envoye">✅ Révélé${marque}</p>`
              : `${indiceAffiche}<button class="btn-reveler" onclick="reveler(${i})">👁️ Révéler${marque}</button>`;
          }

          carte.appendChild(zone);
        });

        if (!indicesEnvoyes) {
          zoneActions.innerHTML = `
            <div class="regle-indice-zone">
              <select id="regleIndicePredefinie" onchange="appliquerRegleIndice()">
                <option value="">-- Remplir avec un indice prédéfini --</option>
                ${Object.entries(reglesIndicesPredefinies).map(([valeur, libelle]) =>
                  `<option value="${valeur}">${libelle}</option>`
                ).join('')}
              </select>
            </div>
            <button onclick="envoyerIndices()">📨 Envoyer les indices</button>
          `;
        } else if (!choixEffectue) {
          zoneActions.innerHTML = '<span class="badge-multijoueur badge-attente">⏳ En attente du choix de l\'autre joueur...</span>';
        } else {
          zoneActions.innerHTML = '<button onclick="terminerTour()">✅ Terminer mon tour</button>';
        }

        // Si le mode "cri" était actif avant ce rafraîchissement, on le réaffiche
        if (!indicesEnvoyes && indiceCriActif) {
          const select = document.getElementById('regleIndicePredefinie');
          if (select) select.value = 'cri';
          afficherCriDansZones(false);
        }

        // Idem pour le mode "silhouette"
        if (!indicesEnvoyes && indiceSilhouetteActif) {
          const select = document.getElementById('regleIndicePredefinie');
          if (select) select.value = 'silhouette';
          afficherSilhouetteDansZones(false);
        }
      }

      function genererBoitesNoires(message) {
        return [0, 1, 2].map(() => `
          <div class="boite-noire boite-inactive">
            <div class="point-interrogation">❔</div>
            <p class="indice-boite">${message}</p>
          </div>
        `).join('');
      }

      function rafraichirVueAttente() {
        mettreAJourVisibiliteRecherche(true);

        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-attente">⏳ C\'est le tour de l\'autre joueur...</span>';

        document.getElementById('tirageBtn').style.display = 'none';
        document.getElementById('zoneActionsMultijoueur').innerHTML = '';

        const container = document.getElementById('pokemonContainer');

        if (!tirageEffectue) {
          container.innerHTML = genererBoitesNoires('En attente du tirage...');
          return;
        }

        if (!indicesEnvoyes) {
          container.innerHTML = genererBoitesNoires('En attente des indices...');
          return;
        }

        container.innerHTML = tirageActuel.map((p, i) => {
          if (revelesTableau[i]) {
            const { idFormate, spriteUrl } = infosAffichagePokemon(p);
            const marque = (i === indexChoisi) ? '<p class="marque-choix">🎉 Ton choix !</p>' : '';
            return `
              <div class="pokemon-card">
                <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
                <p>${p.nom}</p>
                <span class="num">#${idFormate}</span>
                <p class="indice-envoye">${indiceHtml(i, "(pas d'indice)")}</p>
                ${marque}
              </div>
            `;
          }

          const classeChoisie = (choixEffectue && i === indexChoisi) ? ' boite-choisie' : '';
          const classeInactive = choixEffectue ? ' boite-inactive' : '';
          const texteStatut = (choixEffectue && i === indexChoisi)
            ? `${indiceHtml(i, "(pas d'indice)")}<br>🔒 Choix enregistré`
            : indiceHtml(i, "(pas d'indice)");
          const clic = choixEffectue ? '' : `onclick="tenterChoix(${i})"`;

          return `
            <div class="boite-noire${classeChoisie}${classeInactive}" ${clic}>
              <div class="point-interrogation">❔</div>
              <p class="indice-boite">${texteStatut}</p>
            </div>
          `;
        }).join('');
      }

      function afficherEquipesFinales() {
        partieTerminee = true;
        document.getElementById('statutTourZone').innerHTML =
          '<span class="badge-multijoueur badge-connecte">🏆 Équipes complètes !</span>';
        document.getElementById('tirageBtn').style.display = 'none';
        document.getElementById('zoneActionsMultijoueur').innerHTML = '';
        document.getElementById('pokemonContainer').innerHTML = '';
        document.getElementById('filtresGenerations').innerHTML = '';
        document.getElementById('optionsTirage').style.display = 'none';
        document.getElementById('compteurListe').style.display = 'none';
        document.getElementById('equipeGaucheZone').classList.remove('actif');
        document.getElementById('equipeDroiteZone').classList.remove('actif');

        const zone = document.getElementById('equipesFinaleZone');
        zone.style.display = 'block';

        const genererListe = (liste) => liste.map(p => {
          const { idFormate, spriteUrl } = infosAffichagePokemon(p);
          return `
            <div class="pokemon-card">
              <img src="${spriteUrl}" alt="${p.nom}" onerror="this.style.opacity=0.2">
              <p>${p.nom}</p>
              <span class="num">#${idFormate}</span>
            </div>
          `;
        }).join('');

        const monEquipe = equipes[monRoleJeu];
        const equipeAdverse = equipes[monRoleJeu === 'hote' ? 'joueur' : 'hote'];

        zone.innerHTML = `
          <h2 class="titre-equipe">🎉 Ton équipe</h2>
          <div class="pokemon-team-grid">${genererListe(monEquipe)}</div>
          <button id="btnTelechargerEquipe" onclick="genererFormatShowdown()">📋 Générer le format Pokémon Showdown</button>
          <p class="note-showdown">⚠️ Pokémon Showdown n'accepte que les noms anglais — la conversion se fait automatiquement.</p>
          <div id="resultatShowdown"></div>
          <h2 class="titre-equipe">Équipe adverse</h2>
          <div class="pokemon-team-grid">${genererListe(equipeAdverse)}</div>
        `;
      }

      async function genererFormatShowdown() {
        const bouton = document.getElementById('btnTelechargerEquipe');
        const zoneResultat = document.getElementById('resultatShowdown');
        const equipe = equipes[monRoleJeu];
        if (!equipe || equipe.length === 0) return;

        const texteOriginal = bouton.textContent;
        bouton.disabled = true;
        bouton.textContent = '⏳ Génération...';

        try {
          const nomsAnglais = await Promise.all(equipe.map(async (p) => {
            try {
              const dataPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${p.id}`).then(r => r.json());
              const espece = await fetch(dataPokemon.species.url).then(r => r.json());
              const nomEn = espece.names.find(n => n.language.name === 'en');
              return nomEn ? nomEn.name : p.nom;
            } catch {
              return p.nom;
            }
          }));

          const contenu = nomsAnglais.join('\n\n');

          zoneResultat.innerHTML = `
            <textarea id="texteShowdown" class="texte-showdown" readonly>${contenu}</textarea>
            <button id="btnCopierShowdown" onclick="copierFormatShowdown()">📄 Copier</button>
          `;
        } catch (erreur) {
          console.error(erreur);
          alert("Erreur lors de la génération du format. Réessaie.");
        } finally {
          bouton.disabled = false;
          bouton.textContent = texteOriginal;
        }
      }

      function copierFormatShowdown() {
        const champ = document.getElementById('texteShowdown');
        if (!champ) return;

        navigator.clipboard.writeText(champ.value).then(() => {
          const bouton = document.getElementById('btnCopierShowdown');
          const texteOriginal = bouton.textContent;
          bouton.textContent = '✅ Copié !';
          setTimeout(() => { bouton.textContent = texteOriginal; }, 1500);
        });
      }

      // ================= Connexion multijoueur robuste =================
      // 1) Livraison fiable : chaque message de jeu reçoit un numéro (seq) et reste
      //    dans une file d'envoi tant que l'autre joueur ne l'a pas confirmé (ack).
      //    Après une coupure, tout ce qui manque est renvoyé ; à la réception les
      //    doublons sont ignorés et l'ordre est respecté. Aucun message n'est perdu,
      //    même envoyé pendant que la connexion était coupée.
      // 2) Superviseur : toutes les 2 s, on vérifie que le serveur de signalisation et
      //    la liaison avec l'autre joueur sont sains (ping/pong), et on les rétablit
      //    automatiquement sinon (l'hôte reste joignable, le joueur se reconnecte).
      // 3) Sauvegarde : l'état de la partie est gardé dans sessionStorage, donc un
      //    rechargement de page reprend la partie au lieu de la perdre.

      const PREFIXE_SALON = 'starter-aveugle-';
      const CLE_ETAT_PARTIE = 'mp_etat';
      const INTERVALLE_SUPERVISION_MS = 2000;
      const INTERVALLE_PING_MS = 4000;
      const SILENCE_MAX_MS = 20000;
      const DELAI_TENTATIVE_MS = 12000;

      let peerMultijoueur = null;
      let connexionMultijoueur = null;
      let codeSalon = '';
      let quitte = false;
      let partenaireParti = false;
      let dejaConnecte = false;
      let erreurFatale = null;
      let superviseurId = null;

      let seqSortant = 0;          // dernier numéro attribué à un message envoyé
      let fileEnvoi = [];          // messages envoyés mais pas encore confirmés
      let seqEntrant = 0;          // dernier message reçu ET traité (dans l'ordre)
      let tamponEntrant = {};      // messages reçus en avance (trou dans la numérotation)

      let derniereReceptionLe = Date.now();
      let dernierPingLe = 0;
      let dernierTickLe = Date.now();
      let prochaineTentativeLe = 0;
      let debutTentativeLe = 0;
      let nbEchecs = 0;
      let dernierBadge = '';
      let detailPerte = '';        // dernière cause technique de coupure (affichée dans le badge)

      function connexionVivante() {
        return !!(connexionMultijoueur && connexionMultijoueur.open);
      }

      // ---------- Badge d'état ----------

      function afficherBadgeMultijoueur(texte, classe, avecBouton) {
        const cle = texte + '|' + classe + '|' + (avecBouton ? '1' : '0');
        if (cle === dernierBadge) return;
        dernierBadge = cle;

        const badge = document.getElementById('badgeMultijoueur');
        badge.innerHTML = `<span class="badge-multijoueur ${classe}">${texte}${
          avecBouton ? '<button type="button" class="btn-reessayer" onclick="forcerReconnexion()">🔄 Réessayer</button>' : ''
        }</span>`;
      }

      function majBadge() {
        if (erreurFatale) {
          afficherBadgeMultijoueur(erreurFatale, 'badge-erreur', false);
        } else if (connexionVivante()) {
          afficherBadgeMultijoueur('🟢 Connecté avec l\'autre joueur', 'badge-connecte', false);
        } else if (partenaireParti) {
          afficherBadgeMultijoueur('🔴 L\'autre joueur a quitté la partie', 'badge-erreur', false);
        } else if (!dejaConnecte) {
          const texte = nbEchecs >= 3
            ? '⏳ Connexion en cours... vérifie que l\'autre joueur est bien sur la page'
            : '⏳ Connexion avec l\'autre joueur...';
          afficherBadgeMultijoueur(texte, 'badge-attente', nbEchecs >= 3);
        } else {
          afficherBadgeMultijoueur('🟠 Connexion perdue — reconnexion automatique... (tes actions sont gardées et seront envoyées)'
            + (detailPerte ? ' <small>[' + echapperHtml(detailPerte) + ']</small>' : ''), 'badge-attente', true);
        }
      }

      // ---------- Sauvegarde / restauration de la partie ----------

      function construireEtat() {
        return {
          tourDe, tirageActuel, tirageEffectue, indicesEnvoyes, indicesActuels, indicesCris, indicesSilhouettes,
          choixEffectue, indexChoisi, revelesTableau, equipes, partieTerminee, generationsChoisies,
          formesRegionalesActives, inclureLegendaires, inclureFabuleux, inclureNormaux
        };
      }

      function appliquerEtat(e) {
        tourDe = e.tourDe;
        tirageActuel = e.tirageActuel || [];
        tirageEffectue = !!e.tirageEffectue;
        indicesEnvoyes = !!e.indicesEnvoyes;
        indicesActuels = e.indicesActuels || ['', '', ''];
        indicesCris = [0, 1, 2].map(i => (e.indicesCris && urlCriValide(e.indicesCris[i])) ? e.indicesCris[i] : null);
        indicesSilhouettes = [0, 1, 2].map(i => (e.indicesSilhouettes && silhouetteValide(e.indicesSilhouettes[i])) ? e.indicesSilhouettes[i] : null);
        choixEffectue = !!e.choixEffectue;
        indexChoisi = (e.indexChoisi === undefined) ? null : e.indexChoisi;
        revelesTableau = e.revelesTableau || [false, false, false];
        equipes = e.equipes || { hote: [], joueur: [] };
        partieTerminee = !!e.partieTerminee;
        generationsChoisies = e.generationsChoisies || null;
        appliquerOptionFormes(e.formesRegionalesActives !== false);
        appliquerOptionCategories(e.inclureLegendaires !== false, e.inclureFabuleux !== false, e.inclureNormaux !== false);
        indiceCriActif = false;
        indiceSilhouetteActif = false;
      }

      function sauvegarderEtat() {
        if (!modeMultijoueur) return;
        try {
          sessionStorage.setItem(CLE_ETAT_PARTIE, JSON.stringify({
            code: codeSalon,
            partie: idPartie,
            role: monRoleJeu,
            etat: construireEtat(),
            seqSortant,
            seqEntrant,
            fileEnvoi: fileEnvoi.map(({ seq, msg }) => ({ seq, msg }))
          }));
        } catch (erreur) {
          // Stockage plein ou indisponible : la partie continue, sans sauvegarde
        }
      }

      function restaurerEtat() {
        try {
          const brut = sessionStorage.getItem(CLE_ETAT_PARTIE);
          if (!brut) return false;

          const sauvegarde = JSON.parse(brut);
          if (sauvegarde.code !== codeSalon || sauvegarde.partie !== idPartie || sauvegarde.role !== monRoleJeu) {
            sessionStorage.removeItem(CLE_ETAT_PARTIE); // sauvegarde d'une ancienne partie
            return false;
          }

          appliquerEtat(sauvegarde.etat);
          seqSortant = sauvegarde.seqSortant || 0;
          seqEntrant = sauvegarde.seqEntrant || 0;
          fileEnvoi = (sauvegarde.fileEnvoi || []).map(x => ({
            seq: x.seq,
            msg: messageTropGros({ t: 'm', seq: x.seq, msg: x.msg }) ? { type: 'noop' } : x.msg,
            envoyeLe: 0
          }));
          return true;
        } catch (erreur) {
          console.warn('Sauvegarde de partie illisible, on repart de zéro', erreur);
          return false;
        }
      }

      // ---------- Envoi fiable ----------

      // Les messages passent en JSON sans découpage : un message de plus d'environ 16 Ko
      // fait tomber le canal de données (et la reconnexion le renvoie en boucle).
      const TAILLE_MAX_MESSAGE = 14000;

      function messageTropGros(objet) {
        try {
          return JSON.stringify(objet).length > TAILLE_MAX_MESSAGE;
        } catch (erreur) {
          return true;
        }
      }

      function envoyerBrut(objet) {
        if (!connexionVivante()) return false;
        if (messageTropGros(objet)) {
          console.warn('Message trop gros, non envoyé', objet && objet.t);
          return false;
        }
        try {
          connexionMultijoueur.send(objet);
          return true;
        } catch (erreur) {
          console.warn('Envoi impossible', erreur);
          return false;
        }
      }

      function envoyerMessage(msg) {
        seqSortant++;
        fileEnvoi.push({ seq: seqSortant, msg, envoyeLe: 0 });
        sauvegarderEtat();
        transmettreFile(false);
      }

      function transmettreFile(forcer) {
        if (!connexionVivante()) return;
        const maintenant = Date.now();

        fileEnvoi.forEach(item => {
          if (forcer || !item.envoyeLe || maintenant - item.envoyeLe > 5000) {
            // Un message trop gros ne partira jamais : on le remplace par un message vide
            // (même numéro) pour ne pas bloquer la file ni couper la connexion en boucle
            if (messageTropGros({ t: 'm', seq: item.seq, msg: item.msg, ack: seqEntrant })) {
              console.warn('Message trop gros abandonné', item.seq);
              item.msg = { type: 'noop' };
            }
            if (envoyerBrut({ t: 'm', seq: item.seq, msg: item.msg, ack: seqEntrant })) {
              item.envoyeLe = maintenant;
            }
          }
        });
      }

      function purgerFile(ack) {
        if (typeof ack !== 'number') return;
        fileEnvoi = fileEnvoi.filter(item => item.seq > ack);
      }

      // ---------- Réception ----------

      function recevoirBrut(donnee) {
        if (!donnee || typeof donnee !== 'object') return;
        purgerFile(donnee.ack);

        switch (donnee.t) {
          case 'hello': {
            if (donnee.partie && idPartie && donnee.partie !== idPartie) {
              console.warn('Autre partie, connexion ignorée');
              fermerConnexionActuelle();
              return;
            }
            partenaireParti = false;

            // L'autre joueur a perdu son état (plus de sauvegarde) : on lui envoie un instantané
            const plusPetiteSeqDispo = fileEnvoi.length ? fileEnvoi[0].seq : seqSortant + 1;
            if (typeof donnee.ack === 'number' && donnee.ack < plusPetiteSeqDispo - 1) {
              const etatSnap = construireEtat();
              etatSnap.indicesSilhouettes = [null, null, null]; // envoyées à part, une par message
              envoyerBrut({ t: 'snap', etat: etatSnap, seqSortant, seqEntrant });
              indicesSilhouettes.forEach((url, i) => {
                if (url) envoyerBrut({ t: 'sil', index: i, data: url });
              });
            }

            transmettreFile(true); // renvoie tout ce que l'autre n'a pas confirmé
            majBadge();
            break;
          }

          case 'ping':
            envoyerBrut({ t: 'pong', ack: seqEntrant });
            break;

          case 'snap':
            appliquerInstantane(donnee);
            break;

          case 'sil':
            if ([0, 1, 2].includes(donnee.index) && silhouetteValide(donnee.data)) {
              indicesSilhouettes[donnee.index] = donnee.data;
              rafraichirVueMultijoueur();
            }
            break;

          case 'bye':
            partenaireParti = true;
            majBadge();
            break;

          case 'm':
            partenaireParti = false;
            traiterEntrant(donnee.seq, donnee.msg);
            break;

          // 'pong' et 'ack' : rien à faire de plus que purgerFile ci-dessus
        }
      }

      function traiterEntrant(seq, msg) {
        if (typeof seq !== 'number') return;

        if (seq > seqEntrant) {
          tamponEntrant[seq] = msg;

          while (tamponEntrant[seqEntrant + 1] !== undefined) {
            const suivant = tamponEntrant[seqEntrant + 1];
            delete tamponEntrant[seqEntrant + 1];
            seqEntrant++;
            try {
              traiterMessageJeu(suivant);
            } catch (erreur) {
              console.error('Erreur en traitant un message', suivant, erreur);
            }
          }

          sauvegarderEtat();
        }

        // On confirme toujours (même un doublon) pour que l'autre vide sa file
        envoyerBrut({ t: 'ack', ack: seqEntrant });
      }

      function appliquerInstantane(donnee) {
        if (!donnee.etat) return;
        appliquerEtat(donnee.etat);

        seqEntrant = donnee.seqSortant || 0;
        tamponEntrant = {};
        if ((donnee.seqEntrant || 0) > seqSortant) seqSortant = donnee.seqEntrant;
        purgerFile(donnee.seqEntrant || 0);

        if (generationsChoisies) appliquerSelectionGenerations(generationsChoisies);
        afficherMiniEquipes();
        if (partieTerminee) {
          afficherEquipesFinales();
        } else {
          rafraichirVueMultijoueur();
        }
        sauvegarderEtat();
        envoyerBrut({ t: 'ack', ack: seqEntrant });
      }

      // Messages de jeu (une fois reçus dans l'ordre, sans doublon)
      function traiterMessageJeu(donnee) {
        if (!donnee || !donnee.type) return;

        switch (donnee.type) {
          case 'tirage':
            tirageActuel = donnee.pokemons;
            tirageEffectue = true;
            rafraichirVueMultijoueur();
            break;

          case 'selectionGen':
            appliquerSelectionGenerations(donnee.generations);
            break;

          case 'optionFormes':
            appliquerOptionFormes(!!donnee.actif);
            break;

          case 'optionCategories':
            appliquerOptionCategories(!!donnee.legendaires, !!donnee.fabuleux, donnee.normaux !== false);
            break;

          case 'silhouette':
            if ([0, 1, 2].includes(donnee.index) && silhouetteValide(donnee.data)) {
              indicesSilhouettes[donnee.index] = donnee.data;
            }
            break;

          case 'indices':
            indicesActuels = donnee.textes;
            indicesCris = [0, 1, 2].map(i => (donnee.cris && urlCriValide(donnee.cris[i])) ? donnee.cris[i] : null);
            indicesEnvoyes = true;
            rafraichirVueMultijoueur();
            break;

          case 'choix':
            indexChoisi = donnee.index;
            choixEffectue = true;
            equipes[donnee.role].push(tirageActuel[donnee.index]);
            rafraichirVueMultijoueur();
            break;

          case 'reveal':
            revelesTableau[donnee.index] = true;
            rafraichirVueMultijoueur();
            break;

          case 'finTour':
            finDuTour();
            break;
        }
      }

      // ---------- Connexion de données (WebRTC) ----------

      function fermerConnexionActuelle() {
        const ancienne = connexionMultijoueur;
        connexionMultijoueur = null;
        if (ancienne) {
          try { ancienne.close(); } catch (erreur) { /* ignoré */ }
        }
        majBadge();
      }

      function attacherConnexion(conn) {
        // Une nouvelle connexion remplace l'ancienne (ex. l'autre joueur a rechargé sa page)
        if (connexionMultijoueur && connexionMultijoueur !== conn) {
          const ancienne = connexionMultijoueur;
          connexionMultijoueur = conn;
          try { ancienne.close(); } catch (erreur) { /* ignoré */ }
        } else {
          connexionMultijoueur = conn;
        }

        const quandOuverte = () => {
          if (connexionMultijoueur !== conn) return;
          dejaConnecte = true;
          nbEchecs = 0;
          detailPerte = '';
          derniereReceptionLe = Date.now();
          envoyerBrut({ t: 'hello', ack: seqEntrant, partie: idPartie });
          majBadge();
        };

        conn.on('open', quandOuverte);
        if (conn.open) quandOuverte();

        conn.on('data', (donnee) => {
          if (connexionMultijoueur !== conn) return;
          derniereReceptionLe = Date.now();
          recevoirBrut(donnee);
        });

        conn.on('close', () => {
          if (connexionMultijoueur !== conn) return;
          connexionMultijoueur = null;
          majBadge();
        });

        conn.on('error', (erreur) => {
          console.warn('Erreur de connexion', erreur);
          detailPerte = 'erreur : ' + ((erreur && (erreur.type || erreur.message)) || 'inconnue');
          if (connexionMultijoueur !== conn) return;
          try { conn.close(); } catch (e) { /* ignoré */ }
          connexionMultijoueur = null;
          majBadge();
        });
      }

      // ---------- Peer (serveur de signalisation) ----------

      function creerPeer() {
        if (connexionMultijoueur && !connexionMultijoueur.open) connexionMultijoueur = null;

        const peer = (monRoleJeu === 'hote') ? new Peer(PREFIXE_SALON + codeSalon) : new Peer();
        peerMultijoueur = peer;

        peer.on('open', () => {
          if (peer !== peerMultijoueur) return;
          nbEchecs = 0;
          prochaineTentativeLe = 0;
          setTimeout(surveillerConnexion, 0);
        });

        peer.on('connection', (conn) => {
          if (peer !== peerMultijoueur) return;
          if (monRoleJeu !== 'hote') { try { conn.close(); } catch (e) { /* ignoré */ } return; }
          attacherConnexion(conn);
        });

        peer.on('disconnected', () => {
          if (peer !== peerMultijoueur) return;
          prochaineTentativeLe = Date.now() + 500;
        });

        peer.on('close', () => {
          if (peer === peerMultijoueur) peerMultijoueur = null;
        });

        peer.on('error', (erreur) => {
          if (peer !== peerMultijoueur) return;
          console.warn('PeerJS :', erreur.type, erreur);
          nbEchecs++;

          if (erreur.type === 'browser-incompatible') {
            erreurFatale = '⚠️ Ton navigateur ne gère pas le mode multijoueur';
          } else if (erreur.type === 'unavailable-id') {
            // L'ancien identifiant de l'hôte n'est pas encore libéré côté serveur : on réessaie
            prochaineTentativeLe = Date.now() + 3000;
          } else {
            if (erreur.type === 'peer-unavailable' && connexionMultijoueur && !connexionMultijoueur.open) {
              try { connexionMultijoueur.close(); } catch (e) { /* ignoré */ }
              connexionMultijoueur = null;
            }
            prochaineTentativeLe = Date.now() + Math.min(1000 * nbEchecs, 6000);
          }
          majBadge();
        });
      }

      function assurerPeer(maintenant) {
        if (maintenant < prochaineTentativeLe) return;

        if (!peerMultijoueur || peerMultijoueur.destroyed) {
          creerPeer();
          prochaineTentativeLe = maintenant + 800;
          return;
        }

        if (peerMultijoueur.disconnected) {
          try { peerMultijoueur.reconnect(); } catch (erreur) { /* ignoré */ }
          prochaineTentativeLe = maintenant + 2500;
        }
      }

      function assurerConnexionVersHote(maintenant) {
        if (maintenant < prochaineTentativeLe) return;

        const peer = peerMultijoueur;
        if (!peer || !peer.open) return; // assurerPeer s'en occupe

        if (connexionMultijoueur && !connexionMultijoueur.open) {
          if (maintenant - debutTentativeLe < DELAI_TENTATIVE_MS) return; // tentative encore en cours
          try { connexionMultijoueur.close(); } catch (erreur) { /* ignoré */ }
          connexionMultijoueur = null;
          nbEchecs++;
          prochaineTentativeLe = maintenant + Math.min(1000 * nbEchecs, 6000);
          return;
        }

        debutTentativeLe = maintenant;
        const conn = peer.connect(PREFIXE_SALON + codeSalon, { reliable: true, serialization: 'json' });
        attacherConnexion(conn);
      }

      // ---------- Superviseur ----------

      function surveillerConnexion() {
        if (!modeMultijoueur || quitte || erreurFatale) return;

        const maintenant = Date.now();

        // Onglet endormi / timers ralentis : on repart d'une base saine plutôt que de
        // conclure à tort que la connexion est morte
        if (maintenant - dernierTickLe > 8000) {
          derniereReceptionLe = maintenant;
          dernierPingLe = 0;
        }
        dernierTickLe = maintenant;

        assurerPeer(maintenant);

        if (connexionVivante()) {
          if (maintenant - derniereReceptionLe > SILENCE_MAX_MS) {
            console.warn('Plus aucune nouvelle de l\'autre joueur : on rétablit la connexion');
            fermerConnexionActuelle();
          } else {
            if (maintenant - dernierPingLe > INTERVALLE_PING_MS) {
              dernierPingLe = maintenant;
              envoyerBrut({ t: 'ping', ack: seqEntrant });
            }
            transmettreFile(false);
          }
        } else if (monRoleJeu === 'joueur') {
          assurerConnexionVersHote(maintenant);
        }

        majBadge();
      }

      function forcerReconnexion() {
        nbEchecs = 0;
        prochaineTentativeLe = 0;
        if (connexionMultijoueur && !connexionMultijoueur.open) fermerConnexionActuelle();
        if (peerMultijoueur && peerMultijoueur.disconnected && !peerMultijoueur.destroyed) {
          try { peerMultijoueur.reconnect(); } catch (erreur) { /* ignoré */ }
        }
        surveillerConnexion();
      }

      function reveilOnglet() {
        // Retour sur l'onglet : on teste tout de suite la connexion (pong attendu en quelques ms)
        derniereReceptionLe = Date.now() - (SILENCE_MAX_MS - 8000);
        dernierPingLe = 0;
        dernierTickLe = Date.now();
        surveillerConnexion();
      }

      function initMultijoueurDepuisSession() {
        const role = sessionStorage.getItem('mp_role');
        const code = sessionStorage.getItem('mp_code');
        if (!role || !code) return;

        codeSalon = code;
        afficherBadgeMultijoueur('⏳ Connexion avec l\'autre joueur...', 'badge-attente', false);
        initialiserModeMultijoueurJeu();

        creerPeer();
        superviseurId = setInterval(surveillerConnexion, INTERVALLE_SUPERVISION_MS);

        window.addEventListener('online', forcerReconnexion);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) reveilOnglet(); });
        window.addEventListener('pagehide', sauvegarderEtat);
      }

      function couperEtRetourner(evenement) {
        evenement.preventDefault();

        quitte = true;
        clearInterval(superviseurId);
        envoyerBrut({ t: 'bye' });

        // Petit délai pour laisser partir le message "bye" avant de couper
        setTimeout(() => {
          if (connexionMultijoueur) {
            try { connexionMultijoueur.close(); } catch (erreur) { /* ignoré */ }
          }
          if (peerMultijoueur) {
            try { peerMultijoueur.destroy(); } catch (erreur) { /* ignoré */ }
          }

          sessionStorage.removeItem('mp_role');
          sessionStorage.removeItem('mp_code');
          sessionStorage.removeItem('mp_partie');
          sessionStorage.removeItem(CLE_ETAT_PARTIE);

          window.location.href = './index.html';
        }, 150);
      }

      // ---------- Recherche détaillée d'un pokémon (via PokeAPI) ----------

      const ROMAIN_VERS_NUM = {
        i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9
      };

      const TYPES_FR = {
        normal: 'Normal', fighting: 'Combat', flying: 'Vol', poison: 'Poison',
        ground: 'Sol', rock: 'Roche', bug: 'Insecte', ghost: 'Spectre',
        steel: 'Acier', fire: 'Feu', water: 'Eau', grass: 'Plante',
        electric: 'Électrik', psychic: 'Psy', ice: 'Glace', dragon: 'Dragon',
        dark: 'Ténèbres', fairy: 'Fée'
      };

      const COULEURS_FR = {
        black: 'Noir', blue: 'Bleu', brown: 'Marron', gray: 'Gris',
        green: 'Vert', pink: 'Rose', purple: 'Violet', red: 'Rouge',
        white: 'Blanc', yellow: 'Jaune'
      };

      const TYPE_COULEURS = {
        normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C',
        grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
        ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
        rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
        steel: '#B7B7CE', fairy: '#D685AD'
      };

      const TYPE_ICONES = {
        normal: '⚪', fire: '🔥', water: '💧', electric: '⚡', grass: '🌿',
        ice: '❄️', fighting: '👊', poison: '☠️', ground: '🌍', flying: '🪶',
        psychic: '👁️', bug: '🐛', rock: '🪨', ghost: '👻', dragon: '🐉',
        dark: '🌙', steel: '⚙️', fairy: '✨'
      };

      function normaliserTexte(texte) {
        return texte
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      function afficherErreurRecherche(message) {
        document.getElementById('rechercheErreurZone').innerHTML =
          `<p id="rechercheErreur">${message}</p>`;
      }

      // ---------- Autocomplétion ----------

      let listeReferencePokemons = [];

      function masquerSuggestions() {
        const listeSuggestions = document.getElementById('suggestionsListe');
        listeSuggestions.style.display = 'none';
        listeSuggestions.innerHTML = '';
      }

      async function afficherSuggestions() {
        const champ = document.getElementById('rechercheInput');
        const valeur = champ.value.trim();
        const listeSuggestions = document.getElementById('suggestionsListe');

        if (!valeur) {
          masquerSuggestions();
          return;
        }

        if (listeReferencePokemons.length === 0) {
          listeReferencePokemons = await chargerPokemons();
        }

        let resultats;
        if (/^\d+$/.test(valeur)) {
          resultats = listeReferencePokemons.filter(p => String(p.id).includes(valeur));
        } else {
          const valeurNorm = normaliserTexte(valeur);
          resultats = listeReferencePokemons.filter(p =>
            normaliserTexte(p.nom).includes(valeurNorm)
          );
          resultats.sort((a, b) => {
            const aCommence = normaliserTexte(a.nom).startsWith(valeurNorm) ? 0 : 1;
            const bCommence = normaliserTexte(b.nom).startsWith(valeurNorm) ? 0 : 1;
            return aCommence - bCommence;
          });
        }

        resultats = resultats.slice(0, 8);

        if (resultats.length === 0) {
          masquerSuggestions();
          return;
        }

        listeSuggestions.innerHTML = resultats.map(p => {
          const idFormate = String(p.id).padStart(3, '0');
          return `<div class="suggestion-item" onclick="choisirSuggestion(${p.id}, '${p.nom.replace(/'/g, "\\'")}')">${p.nom} <span class="num">#${idFormate}</span></div>`;
        }).join('');

        listeSuggestions.style.display = 'block';
      }

      function choisirSuggestion(id, nom) {
        document.getElementById('rechercheInput').value = nom;
        masquerSuggestions();
        lancerAffichageFiche(id, nom);
      }

      async function lancerAffichageFiche(id, nom) {
        document.getElementById('rechercheErreurZone').innerHTML = '';
        document.getElementById('ficheCorps').innerHTML =
          '<p class="fiche-chargement">Chargement des informations...</p>';
        try {
          await afficherFicheDetaillee(id, nom);
        } catch (erreur) {
          document.getElementById('ficheCorps').innerHTML = '';
          afficherErreurRecherche("Erreur lors de la récupération des informations.");
          console.error(erreur);
        }
      }

      async function rechercherPokemon() {
        const champ = document.getElementById('rechercheInput');
        const requete = champ.value.trim();
        document.getElementById('rechercheErreurZone').innerHTML = '';
        masquerSuggestions();

        if (!requete) return;

        try {
          const liste = await chargerPokemons();
          let pokemonTrouve = null;

          if (/^\d+$/.test(requete)) {
            const idRecherche = parseInt(requete, 10);
            pokemonTrouve = liste.find(p => p.id === idRecherche);
          } else {
            const requeteNorm = normaliserTexte(requete);
            pokemonTrouve = liste.find(p => normaliserTexte(p.nom) === requeteNorm)
              || liste.find(p => normaliserTexte(p.nom).includes(requeteNorm));
          }

          if (!pokemonTrouve) {
            document.getElementById('ficheCorps').innerHTML = '';
            afficherErreurRecherche(`Aucun pokémon trouvé pour « ${requete} ».`);
            return;
          }

          await lancerAffichageFiche(pokemonTrouve.id, pokemonTrouve.nom);
        } catch (erreur) {
          afficherErreurRecherche("Erreur lors de la recherche. Réessaie plus tard.");
          console.error(erreur);
        }
      }

      async function afficherFicheDetaillee(id, nomFr) {
        const dataPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(r => r.json());
        const dataEspece = await fetch(dataPokemon.species.url).then(r => r.json());

        // Génération
        const genRomain = dataEspece.generation.name.replace('generation-', '');
        const genNum = ROMAIN_VERS_NUM[genRomain] || genRomain;

        // Types
        const typesFr = dataPokemon.types
          .map(t => TYPES_FR[t.type.name] || t.type.name)
          .join(' / ');

        // Catégorie
        const genusEntree = dataEspece.genera.find(g => g.language.name === 'fr');
        const categorie = genusEntree ? genusEntree.genus : '—';

        // Taille / poids
        const tailleM = (dataPokemon.height / 10).toFixed(1);
        const poidsKg = (dataPokemon.weight / 10).toFixed(1);

        // Couleur
        const couleur = COULEURS_FR[dataEspece.color.name] || dataEspece.color.name;

        // Taux de capture
        const tauxCapture = dataEspece.capture_rate;

        // Cri
        const criUrl = dataPokemon.cries
          ? (dataPokemon.cries.latest || dataPokemon.cries.legacy)
          : null;

        // Description Pokédex (en français)
        const descriptionEntree = dataEspece.flavor_text_entries.find(
          f => f.language.name === 'fr'
        );
        const description = descriptionEntree
          ? descriptionEntree.flavor_text.replace(/[\n\f\r]/g, ' ')
          : '—';

        // Talents (avec traduction française)
        const talents = await Promise.all(
          dataPokemon.abilities.map(async a => {
            try {
              const detailTalent = await fetch(a.ability.url).then(r => r.json());
              const nomTalentFr = detailTalent.names.find(n => n.language.name === 'fr');
              const nom = nomTalentFr ? nomTalentFr.name : detailTalent.name;
              return nom + (a.is_hidden ? ' (Talent Caché)' : '');
            } catch {
              return a.ability.name;
            }
          })
        );

        // Groupes d'œuf (noms français récupérés directement depuis PokeAPI)
        const groupesOeufListe = await Promise.all(
          dataEspece.egg_groups.map(async g => {
            try {
              const detailGroupe = await fetch(g.url).then(r => r.json());
              const nomFrGroupe = detailGroupe.names.find(n => n.language.name === 'fr');
              return nomFrGroupe ? nomFrGroupe.name : detailGroupe.name;
            } catch {
              return g.name;
            }
          })
        );
        const groupesOeuf = groupesOeufListe.join(', ');

        // Lien vers la fiche Poképédia du pokémon
        const lienPokepedia = `https://www.pokepedia.fr/${nomFr.replace(/ /g, '_')}`;

        // Sensibilités (faiblesses / résistances / immunités selon les types du pokémon)
        const typesDetails = await Promise.all(
          dataPokemon.types.map(t => fetch(t.type.url).then(r => r.json()))
        );

        const multiplicateurs = {};
        Object.keys(TYPES_FR).forEach(t => { multiplicateurs[t] = 1; });

        typesDetails.forEach(detail => {
          const relations = detail.damage_relations;
